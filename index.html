<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect VIP — Gestão Escolar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#e34724;
  --brand-dark:#c03a1c;
  --sidebar-bg:#1e2a38;
  --sidebar-text:#a8c0d0;
  --sidebar-active:#e34724;
  --white:#ffffff;
  --gray-50:#f8f9fa;
  --gray-100:#f1f3f5;
  --gray-200:#e9ecef;
  --gray-300:#dee2e6;
  --gray-500:#adb5bd;
  --gray-700:#495057;
  --gray-900:#212529;
  --success:#28a745;
  --warning:#ffc107;
  --danger:#dc3545;
  --info:#17a2b8;
  --radius:6px;
  --shadow:0 1px 4px rgba(0,0,0,.08);
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--gray-100);color:var(--gray-900);font-size:14px}

/* LOGIN */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#2c3e50}
.login-box{background:var(--white);border-radius:10px;width:360px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.login-header{background:var(--brand);padding:24px;text-align:center;font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px}
.login-body{padding:28px}
.login-title{font-size:16px;color:var(--gray-700);margin-bottom:20px}
.login-title strong{color:var(--gray-900)}
.login-footer{padding:12px 28px;font-size:11px;color:var(--gray-500);border-top:1px solid var(--gray-200);background:var(--gray-50)}
.login-err{background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:8px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;display:none}

/* APP LAYOUT */
#app{display:none;height:100vh;overflow:hidden}
.app-wrap{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{width:220px;background:var(--sidebar-bg);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{background:var(--brand);padding:15px 16px;text-align:center;font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px;cursor:pointer}
.sb-profile{padding:14px;border-bottom:1px solid #2e3d4e;display:flex;align-items:center;gap:10px}
.sb-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600;flex-shrink:0}
.sb-name{color:#fff;font-size:12px;font-weight:600}
.sb-role{color:#7a9ab5;font-size:11px;margin-top:1px}
.sb-section{padding:12px 16px 4px;font-size:10px;color:#4a6070;text-transform:uppercase;letter-spacing:1px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--sidebar-text);font-size:13px;cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.sb-item:hover{background:#253343;color:#fff}
.sb-item.active{background:rgba(227,71,36,.15);color:#e87d60;border-left-color:var(--brand)}
.sb-item i{width:16px;text-align:center;font-size:14px}
.sb-logout{margin-top:auto;border-top:1px solid #2e3d4e}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;background:var(--white);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 20px;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow)}
.topbar-left{font-size:13px;color:var(--gray-700);display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-700)}
.content{flex:1;overflow-y:auto;padding:20px}

/* PAGE */
.breadcrumb{display:flex;gap:6px;font-size:12px;color:var(--gray-500);margin-bottom:10px}
.breadcrumb a{color:var(--brand);text-decoration:none;cursor:pointer}
.page-title{font-size:20px;font-weight:600;color:var(--gray-900);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.page-title i{color:var(--brand)}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{border-radius:var(--radius);padding:16px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.stat-card.c-blue{background:#2d7dd2}
.stat-card.c-green{background:#27a065}
.stat-card.c-amber{background:#d98b0a}
.stat-card.c-red{background:var(--brand)}
.stat-icon{font-size:30px;opacity:.8}
.stat-num{font-size:26px;font-weight:700}
.stat-label{font-size:12px;opacity:.85}

/* PANELS */
.panel{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow)}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:14px;font-weight:600;color:var(--gray-900)}
.panel-body{padding:16px}
.panel-footer{padding:12px 16px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px;background:var(--gray-50);border-radius:0 0 var(--radius) var(--radius)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;text-align:left;border-bottom:2px solid var(--gray-200);font-size:12px;font-weight:600;color:var(--gray-700);background:var(--gray-50);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--gray-200);vertical-align:middle;color:var(--gray-900)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-50)}
.t-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;background:var(--brand);flex-shrink:0}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#d4edda;color:#155724}
.badge-warning{background:#fff3cd;color:#856404}
.badge-danger{background:#f8d7da;color:#721c24}
.badge-info{background:#d1ecf1;color:#0c5460}
.badge-primary{background:#cce5ff;color:#004085}
.badge-secondary{background:#e2e3e5;color:#383d41}
.badge-purple{background:#e9d8fd;color:#553c9a}
.badge-basico{background:#d1ecf1;color:#0c5460}
.badge-intermediario{background:#fff3cd;color:#856404}
.badge-avancado{background:#e9d8fd;color:#553c9a}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:none;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-primary{background:var(--brand);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-default{background:var(--white);color:var(--gray-700);border:1px solid var(--gray-300)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:5px 8px;border:1px solid var(--gray-300);background:var(--white);border-radius:var(--radius);cursor:pointer;color:var(--gray-700)}
.btn-icon:hover{background:var(--gray-100)}

/* FORMS */
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.form-col{flex:1;min-width:140px}
.form-col label,.field label{display:block;font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:4px}
.form-col input,.form-col select,
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;color:var(--gray-900);background:var(--white);transition:border-color .15s}
.field textarea{height:80px;resize:vertical}
.form-col input:focus,.form-col select:focus,
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:14px}
.field-error{color:var(--danger);font-size:11px;margin-top:3px}
.required{color:var(--danger)}
.help-text{font-size:11px;color:var(--gray-500);margin-top:3px}

/* MISC */
.empty-state{text-align:center;padding:40px;color:var(--gray-500)}
.empty-state i{font-size:36px;margin-bottom:12px;display:block;opacity:.4}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:none}
.alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.loading{text-align:center;padding:30px;color:var(--gray-500)}
.loading i{animation:spin 1s linear infinite;font-size:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center}
.confirm-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:360px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.confirm-box h4{margin-bottom:10px;font-size:15px}
.confirm-box p{color:var(--gray-700);font-size:13px;margin-bottom:18px}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<!-- CONFIG SUPABASE: troque pelas suas chaves -->
<script>
const SUPABASE_URL = 'COLE_SUA_URL_AQUI';
const SUPABASE_KEY = 'COLE_SUA_ANON_KEY_AQUI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Usuário logado em memória (sem auth do Supabase, login simples por tabela)
let currentUser = null;
</script>

<!-- ===== LOGIN ===== -->
<div id="login-page">
  <div class="login-box">
    <div class="login-header">Connect Vip</div>
    <div class="login-body">
      <div class="login-title"><strong>Entre</strong> na sua conta</div>
      <div class="login-err" id="login-err"></div>
      <input type="email" id="login-email" class="field" placeholder="E-mail" style="width:100%;padding:8px 10px;border:1px solid #dee2e6;border-radius:6px;font-size:13px;margin-bottom:12px">
      <input type="password" id="login-pass" class="field" placeholder="Senha" style="width:100%;padding:8px 10px;border:1px solid #dee2e6;border-radius:6px;font-size:13px;margin-bottom:16px">
      <div style="display:flex;justify-content:flex-end">
        <button class="btn btn-primary" onclick="doLogin()" style="width:100%">Conecte-se</button>
      </div>
    </div>
    <div class="login-footer">© 2025 Connect VIP</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
<div class="app-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-brand" onclick="nav('dashboard')">Connect Vip</div>
    <div class="sb-profile">
      <div class="sb-avatar" id="sb-avatar">A</div>
      <div>
        <div class="sb-name" id="sb-name">—</div>
        <div class="sb-role" id="sb-role">—</div>
      </div>
    </div>
    <div class="sb-section">Navegação</div>
    <div class="sb-item active" data-page="dashboard" onclick="nav('dashboard')"><i class="fa fa-desktop"></i> Painel</div>
    <div class="sb-item" data-page="schools" onclick="nav('schools')"><i class="fa fa-building"></i> Escola</div>
    <div class="sb-item admin-only" data-page="admins" onclick="nav('admins')"><i class="fa fa-user-tie"></i> Administrador</div>
    <div class="sb-item" data-page="teachers" onclick="nav('teachers')"><i class="fa fa-chalkboard-teacher"></i> Professor</div>
    <div class="sb-item" data-page="students" onclick="nav('students')"><i class="fa fa-user-graduate"></i> Aluno</div>
    <div class="sb-item" data-page="classes" onclick="nav('classes')"><i class="fa fa-layer-group"></i> Turmas</div>
    <div class="sb-logout">
      <div class="sb-item" onclick="doLogout()"><i class="fa fa-sign-out-alt"></i> Sair</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><i class="fa fa-bars"></i> Connect VIP — Sistema de Gestão Escolar</div>
      <div class="topbar-right" id="topbar-user"></div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <h4>Confirmar exclusão</h4>
    <p>Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita.</p>
    <div class="confirm-actions">
      <button class="btn btn-default" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Excluir</button>
    </div>
  </div>
</div>

<script>
// ============================
// UTILS
// ============================
function $(id){return document.getElementById(id)}
function role_badge(role){
  const map={super_admin:'badge-purple',admin:'badge-secondary',escola:'badge-warning',escola_admin:'badge-info',professor:'badge-primary'};
  const label={super_admin:'Super Admin',admin:'Admin',escola:'Escola',escola_admin:'Escola Admin',professor:'Professor'};
  return `<span class="badge ${map[role]||'badge-secondary'}">${label[role]||role}</span>`;
}
function status_badge(s){return s?'<span class="badge badge-success">Ativo</span>':'<span class="badge badge-warning">Inativo</span>';}
function level_badge(l){if(!l)return '—';const m={Básico:'badge-basico',Intermediário:'badge-intermediario',Avançado:'badge-avancado'};return `<span class="badge ${m[l]||'badge-secondary'}">${l}</span>`;}
function fdate(d){if(!d)return '—';return new Date(d).toLocaleDateString('pt-BR');}
function avatar(name){return (name||'?').charAt(0).toUpperCase();}
function showAlert(id,msg,type='success'){const el=$(id);if(!el)return;el.className='alert alert-'+type;el.textContent=msg;el.style.display='block';setTimeout(()=>{el.style.display='none'},3500);}
function closeConfirm(){$('confirm-overlay').style.display='none';}
function showConfirm(cb){
  $('confirm-overlay').style.display='flex';
  $('confirm-yes').onclick=()=>{closeConfirm();cb();};
}
function setActive(page){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  const el=document.querySelector(`.sb-item[data-page="${page}"]`);
  if(el)el.classList.add('active');
}
function nav(page, params={}){
  setActive(page);
  pages[page]&&pages[page](params);
}

// ============================
// AUTH
// ============================
async function doLogin(){
  const email=$('login-email').value.trim();
  const pass=$('login-pass').value.trim();
  if(!email||!pass){showLoginErr('Preencha e-mail e senha.');return;}
  const{data,error}=await sb.from('users').select('*').eq('email',email).single();
  if(error||!data){showLoginErr('E-mail não encontrado.');return;}
  // senha simples: compara texto puro (para produção use hash bcrypt no backend)
  if(data.password_hash!==pass&&data.password_hash!=='trocar_senha'){showLoginErr('Senha incorreta.');return;}
  currentUser=data;
  startApp();
}
function showLoginErr(msg){const el=$('login-err');el.textContent=msg;el.style.display='block';}
function doLogout(){currentUser=null;$('login-page').style.display='flex';$('app').style.display='none';}
function startApp(){
  $('login-page').style.display='none';
  $('app').style.display='block';
  $('sb-name').textContent=currentUser.name;
  $('sb-avatar').textContent=avatar(currentUser.name);
  const roles={super_admin:'Super Admin',admin:'Admin',escola:'Escola',escola_admin:'Escola Admin',professor:'Professor'};
  $('sb-role').textContent=roles[currentUser.role]||currentUser.role;
  $('topbar-user').innerHTML=`<i class="fa fa-user-circle" style="color:var(--brand);font-size:18px"></i> &nbsp;${currentUser.name}`;
  if(!['super_admin','admin'].includes(currentUser.role)){
    document.querySelectorAll('.admin-only').forEach(el=>el.style.display='none');
  }
  nav('dashboard');
}

// ============================
// PAGES
// ============================
const pages={};

// --- DASHBOARD ---
pages.dashboard=async function(){
  setContent(`<div class="loading"><i class="fa fa-spinner"></i> Carregando...</div>`);
  const [sc,tc,st,cl]=await Promise.all([
    sb.from('schools').select('id',{count:'exact',head:true}).eq('status',true),
    sb.from('teachers').select('id',{count:'exact',head:true}).eq('status',true),
    sb.from('students').select('id',{count:'exact',head:true}).eq('status',true),
    sb.from('classes').select('id',{count:'exact',head:true}).eq('status',true),
  ]);
  setContent(`
    <div class="breadcrumb"><span>Home</span> › <span>Painel</span></div>
    <div class="page-title"><i class="fa fa-desktop"></i> Painel</div>
    <div class="stat-grid">
      <div class="stat-card c-blue"><i class="fa fa-building stat-icon"></i><div><div class="stat-num">${sc.count??0}</div><div class="stat-label">Escolas ativas</div></div></div>
      <div class="stat-card c-green"><i class="fa fa-chalkboard-teacher stat-icon"></i><div><div class="stat-num">${tc.count??0}</div><div class="stat-label">Professores</div></div></div>
      <div class="stat-card c-amber"><i class="fa fa-user-graduate stat-icon"></i><div><div class="stat-num">${st.count??0}</div><div class="stat-label">Alunos matriculados</div></div></div>
      <div class="stat-card c-red"><i class="fa fa-layer-group stat-icon"></i><div><div class="stat-num">${cl.count??0}</div><div class="stat-label">Turmas ativas</div></div></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">Acesso rápido</span></div>
        <div class="panel-body" style="padding:8px 0">
          ${['schools','teachers','students','classes'].map(p=>{
            const icons={schools:'fa-building',teachers:'fa-chalkboard-teacher',students:'fa-user-graduate',classes:'fa-layer-group'};
            const labels={schools:'Adicionar escola',teachers:'Adicionar professor',students:'Adicionar aluno',classes:'Criar turma'};
            return `<div onclick="nav('${p}',{view:'form'})" style="display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--gray-200);color:var(--gray-700);font-size:13px" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background=''"><i class="fa ${icons[p]}" style="color:var(--brand);width:16px"></i>${labels[p]}</div>`;
          }).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-title">Níveis de permissão</span></div>
        <div class="panel-body" style="padding:0">
          <table>
            <tr><td style="padding:8px 12px">1</td><td style="padding:8px 12px"><span class="badge badge-purple">Super Admin</span></td></tr>
            <tr><td style="padding:8px 12px">2</td><td style="padding:8px 12px"><span class="badge badge-secondary">Admin</span></td></tr>
            <tr><td style="padding:8px 12px">3</td><td style="padding:8px 12px"><span class="badge badge-warning">Escola</span></td></tr>
            <tr><td style="padding:8px 12px">4</td><td style="padding:8px 12px"><span class="badge badge-info">Escola Admin</span></td></tr>
            <tr><td style="padding:8px 12px">5</td><td style="padding:8px 12px"><span class="badge badge-primary">Professor</span></td></tr>
          </table>
        </div>
      </div>
    </div>
  `);
};

// --- SCHOOLS ---
pages.schools=async function({view,id}={}){
  if(view==='form') return schoolForm(id);
  setContent(`<div class="loading"><i class="fa fa-spinner"></i></div>`);
  const name=getFilter('sch-name')||'';
  const status=getFilter('sch-status');
  let q=sb.from('schools').select('*').order('created_at',{ascending:false});
  if(name) q=q.ilike('name','%'+name+'%');
  if(status==='1') q=q.eq('status',true);
  if(status==='0') q=q.eq('status',false);
  const{data=[]}=await q;
  setContent(`
    <div class="breadcrumb"><span>Home</span> › <span>Escola</span></div>
    <div class="page-title"><i class="fa fa-building"></i> Escola</div>
    <div id="page-alert" class="alert"></div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Busca</span></div>
      <div class="panel-body">
        <div class="form-row">
          <div class="form-col"><label>Nome</label><input id="sch-name" placeholder="Nome da escola" value="${name}"></div>
          <div class="form-col"><label>Status</label><select id="sch-status"><option value="">Todos</option><option value="1" ${status==='1'?'selected':''}>Ativo</option><option value="0" ${status==='0'?'selected':''}>Inativo</option></select></div>
        </div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="nav('schools')"><i class="fa fa-search"></i> Busca</button><button class="btn btn-danger" onclick="clearFilters(['sch-name','sch-status']);nav('schools')">Limpa</button></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Lista de escolas</span><button class="btn btn-primary btn-sm" onclick="nav('schools',{view:'form'})"><i class="fa fa-plus"></i> Adicionar escola</button></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Endereço</th><th>Status</th><th>Cadastro</th><th colspan="2">Ações</th></tr></thead>
          <tbody>${data.length?data.map((s,i)=>`
            <tr>
              <td>${i+1}</td>
              <td><div style="display:flex;align-items:center;gap:8px"><div class="t-avatar">${avatar(s.name)}</div><strong>${s.name}</strong></div></td>
              <td>${s.email||'—'}</td>

  const payload={first_name:fn,last_name:ln,gender:$('f-gender').value||null,date_birth:$('f-dob').value||null,date_joining:doj,mobile_number:mobile,parent_name:$('f-parent').value,parent_mobile:$('f-parent-m').value,address:$('f-address').value,class_id:$('f-class').value||null,school_id:$('f-school').value||null,level:$('f-level').value||null,note:$('f-note').value,status:$('f-status').value==='true'};
  let err;
  if(id){const r=await sb.from('students').update(payload).eq('id',id);err=r.error;}
  else{const r=await sb.from('students').insert(payload);err=r.error;}
  if(err){showAlert('page-alert','Erro: '+err.message,'danger');return;}
  nav('students');
}

// --- CLASSES ---
pages.classes=async function({view,id}={}){
  if(view==='form') return classForm(id);
  setContent(`<div class="loading"><i class="fa fa-spinner"></i></div>`);
  const{data=[]}=await sb.from('classes').select('*,teacher:teachers(first_name,last_name),school:schools(name)').order('created_at',{ascending:false});
  // count students per class
  const counts={};
  for(const c of data){const{count}=await sb.from('students').select('id',{count:'exact',head:true}).eq('class_id',c.id).eq('status',true);counts[c.id]=count||0;}
  setContent(`
    <div class="breadcrumb"><span>Home</span> › <span>Turmas</span></div>
    <div class="page-title"><i class="fa fa-layer-group"></i> Turmas</div>
    <div id="page-alert" class="alert"></div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Lista de turmas</span><button class="btn btn-primary btn-sm" onclick="nav('classes',{view:'form'})"><i class="fa fa-plus"></i> Criar turma</button></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>Professor</th><th>Escola</th><th>Horário</th><th>Nível</th><th>Alunos</th><th>Status</th><th colspan="2">Ações</th></tr></thead>
          <tbody>${data.length?data.map((c,i)=>`
            <tr>
              <td>${i+1}</td>
              <td><strong>${c.name}</strong></td>
              <td>${c.teacher?c.teacher.first_name+' '+c.teacher.last_name:'—'}</td>
              <td>${c.school?.name||'—'}</td>
              <td>${c.schedule||'—'}</td>
              <td>${level_badge(c.level)}</td>
              <td><span class="badge badge-info">${counts[c.id]}</span></td>
              <td>${status_badge(c.status)}</td>
              <td><button class="btn-icon" onclick="nav('classes',{view:'form',id:'${c.id}'})"><i class="fa fa-pencil-alt"></i></button></td>
              <td><button class="btn-icon" style="color:var(--danger)" onclick="deleteRecord('classes','${c.id}','classes')"><i class="fa fa-trash"></i></button></td>
            </tr>`).join(''):`<tr><td colspan="10"><div class="empty-state"><i class="fa fa-layer-group"></i>Nenhuma turma cadastrada</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `);
};

async function classForm(id){
  const[{data:teachers=[]},{data:schools=[]}]=await Promise.all([sb.from('teachers').select('id,first_name,last_name').eq('status',true),sb.from('schools').select('id,name').eq('status',true)]);
  let c={};
  if(id){const{data}=await sb.from('classes').select('*').eq('id',id).single();c=data||{};}
  const tOpts=teachers.map(t=>`<option value="${t.id}" ${c.teacher_id===t.id?'selected':''}>${t.first_name} ${t.last_name}</option>`).join('');
  const sOpts=schools.map(s=>`<option value="${s.id}" ${c.school_id===s.id?'selected':''}>${s.name}</option>`).join('');
  setContent(`
    <div class="breadcrumb"><a onclick="nav('classes')">Turmas</a> › <span>${id?'Editar':'Criar'}</span></div>
    <div class="page-title"><i class="fa fa-layer-group"></i> ${id?'Editar':'Criar'} turma</div>
    <div id="page-alert" class="alert"></div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">${id?'Atualizar':'Nova'} turma</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <div>
            <div class="field"><label>Nome da turma <span class="required">*</span></label><input id="f-name" value="${c.name||''}" placeholder="Ex: Turma A — Básico"></div>
            <div class="field"><label>Professor</label><select id="f-teacher"><option value="">Nenhum</option>${tOpts}</select></div>
            <div class="field"><label>Escola</label><select id="f-school"><option value="">Nenhuma</option>${sOpts}</select></div>
          </div>
          <div>
            <div class="field"><label>Horário</label><input id="f-schedule" value="${c.schedule||''}" placeholder="Ex: Seg/Qua 19h–20h30"></div>
            <div class="field"><label>Nível</label><select id="f-level"><option value="">Selecione</option><option value="Básico" ${c.level==='Básico'?'selected':''}>Básico</option><option value="Intermediário" ${c.level==='Intermediário'?'selected':''}>Intermediário</option><option value="Avançado" ${c.level==='Avançado'?'selected':''}>Avançado</option></select></div>
            <div class="field"><label>Status</label><select id="f-status"><option value="true" ${c.status!==false?'selected':''}>Ativo</option><option value="false" ${c.status===false?'selected':''}>Inativo</option></select></div>
          </div>
        </div>
      </div>
      <div class="panel-footer">
        <button class="btn btn-default" onclick="nav('classes')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveClass('${id||''}')"><i class="fa fa-save"></i> ${id?'Atualizar':'Criar'}</button>
      </div>
    </div>
  `);
}

async function saveClass(id){
  const name=$('f-name').value.trim();
  if(!name){showAlert('page-alert','Informe o nome da turma.','danger');return;}
  const payload={name,teacher_id:$('f-teacher').value||null,school_id:$('f-school').value||null,schedule:$('f-schedule').value,level:$('f-level').value||null,status:$('f-status').value==='true'};
  let err;
  if(id){const r=await sb.from('classes').update(payload).eq('id',id);err=r.error;}
  else{const r=await sb.from('classes').insert(payload);err=r.error;}
  if(err){showAlert('page-alert','Erro: '+err.message,'danger');return;}
  nav('classes');
}

// ============================
// HELPERS

function setContent(html){$('content').innerHTML=html;}

async function deleteRecord(table,id,returnPage){
  showConfirm(async()=>{
    const{error}=await sb.from(table).delete().eq('id',id);
    if(error){alert('Erro ao excluir: '+error.message);return;}
    nav(returnPage);
  });
}

const _filters={};
function getFilter(key){return $( key)?.value||_filters[key]||'';}
function clearFilters(keys){keys.forEach(k=>{const el=$(k);if(el)el.value='';delete _filters[k];});}

// Enter no login
document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('login-page').style.display!=='none')doLogin();});
});
