<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Coordenação — Connect Inglês VIP</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ground:#F6F4EF;
    --surface:#FFFFFF;
    --surface-sunken:#F0EDE6;
    --border:#E3DFD5;
    --text:#242220;
    --text-muted:#736C5F;
    --accent:#38508C;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7ECF7;
    --whats:#1E8E5A;
    --whats-ink:#FFFFFF;
    --danger:#B5493B;
    --chip:#EFE6D4;
    --chip-ink:#7A5B21;
    --shadow: 0 1px 2px rgba(36,34,32,0.06), 0 8px 24px -12px rgba(36,34,32,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#17181B;
      --surface:#1F2124;
      --surface-sunken:#26282C;
      --border:#33353A;
      --text:#EDEAE3;
      --text-muted:#9C978D;
      --accent:#8FA6E0;
      --accent-ink:#111318;
      --accent-soft:#28304A;
      --whats:#4FBE8C;
      --whats-ink:#0D1712;
      --danger:#E19082;
      --chip:#332C1C;
      --chip-ink:#E3C077;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#17181B;
    --surface:#1F2124;
    --surface-sunken:#26282C;
    --border:#33353A;
    --text:#EDEAE3;
    --text-muted:#9C978D;
    --accent:#8FA6E0;
    --accent-ink:#111318;
    --accent-soft:#28304A;
    --whats:#4FBE8C;
    --whats-ink:#0D1712;
    --danger:#E19082;
    --chip:#332C1C;
    --chip-ink:#E3C077;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.hero{
    background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black 10%));
    color:var(--accent-ink);
    border-radius:18px;
    padding:26px 28px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  header.hero h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.7rem;
    margin:0 0 4px;
    text-wrap:balance;
    font-weight:600;
  }
  header.hero p{
    margin:0;
    opacity:.82;
    font-size:.9rem;
  }
  .hero-meta{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.75;
    text-align:right;
    max-width:220px;
  }

  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px;
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  nav.tabs button{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:.85rem;
    font-weight:600;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-sunken); color:var(--text); }
  nav.tabs button[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  nav.tabs svg{ flex:none; }

  .panel{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:760px){
    .panel{ grid-template-columns:280px 1fr; align-items:start; }
    .panel.single{ grid-template-columns:1fr; max-width:520px; margin:0 auto; }
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:1rem;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
  }

  form{ display:flex; flex-direction:column; gap:12px; }
  .field label{
    display:block;
    font-size:.72rem;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  input,select,textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:9px 10px;
    font-size:.88rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{ resize:vertical; min-height:88px; }

  .btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-whats{ background:var(--whats); color:var(--whats-ink); }
  .btn-whats:hover{ filter:brightness(1.05); }
  .btn-whats[disabled]{ opacity:.45; cursor:not-allowed; }

  .empty{ color:var(--text-muted); font-size:.85rem; }

  .list{ display:grid; gap:10px; }
  @media (min-width:640px){ .list.two-col{ grid-template-columns:1fr 1fr; } }

  .row{
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .row .name{ font-weight:700; font-size:.92rem; }
  .row .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:6px;
    font-size:.75rem;
    color:var(--text-muted);
  }
  .row .meta span{ display:flex; align-items:center; gap:4px; }
  .row .meta svg{ flex:none; opacity:.8; }
  .row .stack{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }

  .icon-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    flex:none;
  }
  .icon-btn:hover{ color:var(--danger); background:var(--surface); }

  .pill{
    display:inline-block;
    background:var(--chip);
    color:var(--chip-ink);
    font-size:.68rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .toggle-group{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toggle{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:10px;
    padding:9px;
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .toggle[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .note{
    font-size:.78rem;
    color:var(--text-muted);
    background:var(--surface-sunken);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    line-height:1.45;
  }
</style>
</head>
<body>

<div class="page">
  <header class="hero">
    <div>
      <h1>Painel da Coordenação</h1>
      <p>Gestão de horários, professores e comunicação rápida</p>
    </div>
    <div class="hero-meta">Dados salvos só neste navegador — não sincroniza entre dispositivos</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="tabpanel"></div>
</div>

<script>
(function(){
  const ICONS = {
    calendar:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    userCheck:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>',
    message:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    send:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>',
    clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    pin:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    mail:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
    phone:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    id:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>'
  };

  const load = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : fallback; } catch(e){ return fallback; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.'); } };
  const genId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const maskCpf = v => v.replace(/\D/g,'').slice(0,11)
    .replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  const maskTelefone = v => v.replace(/\D/g,'').slice(0,11)
    .replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');

  let state = {
    professores: load('coord_professores', []),
    horarios: load('coord_horarios', []),
    lideres: load('coord_lideres', []),
    activeTab: 'horarios',
    novoProf: { nome:'', cpf:'', dataNasc:'', email:'', telefone:'' },
    novoHorario: { professor:'', dia:'Segunda', horario:'', sala:'' },
    novoLider: { periodo:'', nome:'', telefone:'' },
    mensagem: { destinatarioTipo:'lider', id:'', texto:'' }
  };

  function persist(){
    save('coord_professores', state.professores);
    save('coord_horarios', state.horarios);
    save('coord_lideres', state.lideres);
  }

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const TABS = [
    { id:'horarios', label:'Horários e Salas', icon:ICONS.calendar },
    { id:'professores', label:'Professores', icon:ICONS.users },
    { id:'lideres', label:'Líderes de Turma', icon:ICONS.userCheck },
    { id:'mensagens', label:'Disparo WhatsApp', icon:ICONS.message }
  ];

  function renderTabs(){
    const nav = document.getElementById('tabs');
    nav.innerHTML = TABS.map(t => `
      <button type="button" data-tab="${t.id}" aria-selected="${state.activeTab===t.id}">
        ${t.icon}${esc(t.label)}
      </button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      state.activeTab = b.dataset.tab;
      renderAll();
    }));
  }

  function renderHorarios(){
    const rows = state.horarios;
    return `
    <div class="panel">
      <form class="card" id="form-horario">
        <h2>${ICONS.plus} Novo Horário</h2>
        <div class="field">
          <label>Professor</label>
          ${state.professores.length === 0 ? `
            <p class="note">Cadastre um professor na aba "Professores" antes de alocar horários.</p>
          ` : `
            <select id="h-professor">
              <option value="">-- Selecione --</option>
              ${state.professores.map(p=>`<option value="${esc(p.nome)}" ${state.novoHorario.professor===p.nome?'selected':''}>${esc(p.nome)}</option>`).join('')}
            </select>
          `}
        </div>
        <div class="field"><label>Dia da semana</label>
          <select id="h-dia">
            ${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map(d=>`<option ${state.novoHorario.dia===d?'selected':''}>${d}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Horário</label><input id="h-horario" placeholder="Ex: 08:00 - 10:00" value="${esc(state.novoHorario.horario)}"></div>
        <div class="field"><label>Sala / Bloco</label><input id="h-sala" placeholder="Ex: Sala 203" value="${esc(state.novoHorario.sala)}"></div>
        <button type="submit" class="btn btn-primary">Adicionar à grade</button>
      </form>
      <div class="card">
        <h2>Grade alocada</h2>
        ${rows.length===0 ? `<p class="empty">Nenhum horário cadastrado ainda.</p>` : `
        <div class="list">
          ${rows.map(item => `
            <div class="row">
              <div>
                <div class="name">${esc(item.professor)}</div>
                <div class="meta">
                  <span>${ICONS.clock} ${esc(item.dia)} (${esc(item.horario)})</span>
                  <span>${ICONS.pin} ${esc(item.sala)}</span>
                </div>
              </div>
              <button class="icon-btn" data-del-horario="${item.id}" aria-label="Remover horário">${ICONS.trash}</button>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function renderProfessores(){
    const rows = state.professores;
    return `
    <div class="panel">
      <form class="card" id="form-prof">
        <h2>${ICONS.plus} Cadastrar Professor</h2>
        <div class="field"><label>Nome completo</label><input id="p-nome" value="${esc(state.novoProf.nome)}"></div>
        <div class="field"><label>CPF</label><input id="p-cpf" value="${esc(state.novoProf.cpf)}"></div>
        <div class="field"><label>Data de nascimento</label><input id="p-data" placeholder="DD/MM/AAAA" value="${esc(state.novoProf.dataNasc)}"></div>
        <div class="field"><label>E-mail</label><input id="p-email" type="email" value="${esc(state.novoProf.email)}"></div>
        <div class="field"><label>Telefone / WhatsApp</label><input id="p-telefone" value="${esc(state.novoProf.telefone)}"></div>
        <button type="submit" class="btn btn-primary">Salvar professor</button>
      </form>
      <div class="card">
        <h2>Corpo docente</h2>
        ${rows.length===0 ? `<p class="empty">Nenhum professor cadastrado.</p>` : `
        <div class="list two-col">
          ${rows.map(p => `
            <div class="row">
              <div>
                <div class="name">${esc(p.nome)}</div>
                <div class="stack meta">
                  <span>${ICONS.id} CPF: ${esc(p.cpf) || 'Não informado'}</span>
                  <span>${ICONS.mail} ${esc(p.email) || 'Não informado'}</span>
                  <span>${ICONS.phone} ${esc(p.telefone) || 'Não informado'}</span>
                </div>
              </div>
              <button class="icon-btn" data-del-prof="${p.id}" aria-label="Remover professor">${ICONS.trash}</button>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function renderLideres(){
    const rows = state.lideres;
    return `
    <div class="panel">
      <form class="card" id="form-lider">
        <h2>${ICONS.plus} Vincular Líder</h2>
        <div class="field"><label>Período / turma</label><input id="l-periodo" placeholder="Ex: 1º Período" value="${esc(state.novoLider.periodo)}"></div>
        <div class="field"><label>Nome do líder</label><input id="l-nome" value="${esc(state.novoLider.nome)}"></div>
        <div class="field"><label>WhatsApp (com DDD)</label><input id="l-telefone" value="${esc(state.novoLider.telefone)}"></div>
        <button type="submit" class="btn btn-primary">Salvar líder</button>
      </form>
      <div class="card">
        <h2>Líderes de turma</h2>
        ${rows.length===0 ? `<p class="empty">Nenhum líder cadastrado.</p>` : `
        <div class="list two-col">
          ${rows.map(l => `
            <div class="row">
              <div>
                <span class="pill">${esc(l.periodo)}</span>
                <div class="name" style="margin-top:8px">${esc(l.nome)}</div>
                <div class="meta"><span>${ICONS.phone} ${esc(l.telefone)}</span></div>
              </div>
              <button class="icon-btn" data-del-lider="${l.id}" aria-label="Remover líder">${ICONS.trash}</button>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function renderMensagens(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const hasPhone = !!(selected && selected.telefone);
    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.send} Enviar mensagem rápida via WhatsApp</h2>
        <div class="toggle-group" style="margin-bottom:12px">
          <button type="button" class="toggle" id="tog-lider" aria-pressed="${state.mensagem.destinatarioTipo==='lider'}">Para líder de turma</button>
          <button type="button" class="toggle" id="tog-prof" aria-pressed="${state.mensagem.destinatarioTipo==='prof'}">Para professor</button>
        </div>
        <div class="field">
          <label>Destinatário</label>
          <select id="m-dest">
            <option value="">-- Selecione --</option>
            ${list.map(x => `<option value="${x.id}" ${String(state.mensagem.id)===String(x.id)?'selected':''}>${state.mensagem.destinatarioTipo==='lider' ? esc(x.periodo)+' — '+esc(x.nome) : esc(x.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Mensagem / lembrete</label>
          <textarea id="m-texto" placeholder="Digite o aviso ou lembrete...">${esc(state.mensagem.texto)}</textarea>
        </div>
        ${selected && !hasPhone ? `<p class="note">Esse destinatário não tem telefone cadastrado — edite o cadastro antes de enviar.</p>` : ''}
        <a class="btn btn-whats" id="m-send" href="#" target="_blank" rel="noopener noreferrer" ${hasPhone ? '' : 'aria-disabled="true"'} style="${hasPhone ? '' : 'pointer-events:none;opacity:.45;'}">${ICONS.send} Abrir no WhatsApp</a>
      </div>
    </div>`;
  }

  function renderAll(){
    renderTabs();
    const panel = document.getElementById('tabpanel');
    if (state.activeTab === 'horarios') panel.innerHTML = renderHorarios();
    else if (state.activeTab === 'professores') panel.innerHTML = renderProfessores();
    else if (state.activeTab === 'lideres') panel.innerHTML = renderLideres();
    else panel.innerHTML = renderMensagens();
    bind();
  }

  function bind(){
    if (state.activeTab === 'horarios') {
      const f = document.getElementById('form-horario');
      const profSel = document.getElementById('h-professor');
      if (profSel) profSel.addEventListener('change', e=>{ state.novoHorario.professor = e.target.value; });
      ['h-dia','h-horario','h-sala'].forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          const map = {'h-dia':'dia','h-horario':'horario','h-sala':'sala'};
          state.novoHorario[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoHorario.professor || !state.novoHorario.horario) return;
        const conflitoProfessor = state.horarios.some(h => h.professor===state.novoHorario.professor && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
        if (conflitoProfessor) { alert(state.novoHorario.professor + ' já tem uma aula alocada nesse dia e horário.'); return; }
        const salaLimpa = state.novoHorario.sala.trim();
        if (salaLimpa) {
          const conflitoSala = state.horarios.some(h => h.sala.trim()===salaLimpa && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
          if (conflitoSala) { alert('A sala ' + salaLimpa + ' já está ocupada nesse dia e horário.'); return; }
        }
        state.horarios.push({...state.novoHorario, id:genId()});
        state.novoHorario = { professor:'', dia:'Segunda', horario:'', sala:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-horario]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este horário da grade?')) return;
        state.horarios = state.horarios.filter(h=>String(h.id)!==b.dataset.delHorario);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'professores') {
      const f = document.getElementById('form-prof');
      const map = {'p-nome':'nome','p-cpf':'cpf','p-data':'dataNasc','p-email':'email','p-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'p-cpf') v = maskCpf(v);
          if (id === 'p-telefone') v = maskTelefone(v);
          state.novoProf[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoProf.nome) return;
        const cpfLimpo = state.novoProf.cpf.replace(/\D/g,'');
        if (cpfLimpo && state.professores.some(p => p.cpf.replace(/\D/g,'') === cpfLimpo)) {
          alert('Já existe um professor cadastrado com esse CPF.');
          return;
        }
        state.professores.push({...state.novoProf, id:genId()});
        state.novoProf = { nome:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-prof]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este professor do cadastro?')) return;
        state.professores = state.professores.filter(p=>String(p.id)!==b.dataset.delProf);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'lideres') {
      const f = document.getElementById('form-lider');
      const map = {'l-periodo':'periodo','l-nome':'nome','l-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'l-telefone') v = maskTelefone(v);
          state.novoLider[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoLider.periodo || !state.novoLider.nome) return;
        state.lideres.push({...state.novoLider, id:genId()});
        state.novoLider = { periodo:'', nome:'', telefone:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-lider]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este líder de turma?')) return;
        state.lideres = state.lideres.filter(l=>String(l.id)!==b.dataset.delLider);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'mensagens') {
      document.getElementById('tog-lider').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'lider', id:'' };
        renderAll();
      });
      document.getElementById('tog-prof').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'prof', id:'' };
        renderAll();
      });
      document.getElementById('m-dest').addEventListener('change', e=>{
        state.mensagem.id = e.target.value; renderAll();
      });
      document.getElementById('m-texto').addEventListener('input', e=>{
        state.mensagem.texto = e.target.value;
        const link = document.getElementById('m-send');
        if (link) link.href = buildWhatsLink();
      });
      const link = document.getElementById('m-send');
      if (link) link.href = buildWhatsLink();
    }
  }

  function buildWhatsLink(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const num = (selected && selected.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(state.mensagem.texto)}`;
  }

  function panel_query(sel){ return Array.from(document.getElementById('tabpanel').querySelectorAll(sel)); }

  renderAll();
})();
</script>
</body>
</html>
