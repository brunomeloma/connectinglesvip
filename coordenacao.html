<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Coordenação — FEST</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ground:#F6F4EF;
    --surface:#FFFFFF;
    --surface-sunken:#F0EDE6;
    --border:#E3DFD5;
    --text:#242220;
    --text-muted:#736C5F;
    --accent:#38508C;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7ECF7;
    --whats:#1E8E5A;
    --whats-ink:#FFFFFF;
    --danger:#B5493B;
    --chip:#EFE6D4;
    --chip-ink:#7A5B21;
    --warn-bg:#FCE8B4;
    --warn-ink:#7A5B00;
    --ok-bg:#CFEFD9;
    --ok-ink:#116136;
    --shadow: 0 1px 2px rgba(36,34,32,0.06), 0 8px 24px -12px rgba(36,34,32,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#17181B;
      --surface:#1F2124;
      --surface-sunken:#26282C;
      --border:#33353A;
      --text:#EDEAE3;
      --text-muted:#9C978D;
      --accent:#8FA6E0;
      --accent-ink:#111318;
      --accent-soft:#28304A;
      --whats:#4FBE8C;
      --whats-ink:#0D1712;
      --danger:#E19082;
      --chip:#332C1C;
      --chip-ink:#E3C077;
      --warn-bg:#4A3B12;
      --warn-ink:#F0CD6A;
      --ok-bg:#123B27;
      --ok-ink:#6FE3A6;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#17181B;
    --surface:#1F2124;
    --surface-sunken:#26282C;
    --border:#33353A;
    --text:#EDEAE3;
    --text-muted:#9C978D;
    --accent:#8FA6E0;
    --accent-ink:#111318;
    --accent-soft:#28304A;
    --whats:#4FBE8C;
    --whats-ink:#0D1712;
    --danger:#E19082;
    --chip:#332C1C;
    --chip-ink:#E3C077;
    --warn-bg:#4A3B12;
    --warn-ink:#F0CD6A;
    --ok-bg:#123B27;
    --ok-ink:#6FE3A6;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.hero{
    background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black 10%));
    color:var(--accent-ink);
    border-radius:18px;
    padding:26px 28px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  header.hero h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.7rem;
    margin:0 0 4px;
    text-wrap:balance;
    font-weight:600;
  }
  header.hero p{
    margin:0;
    opacity:.82;
    font-size:.9rem;
  }
  .hero-meta{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.75;
    text-align:right;
    max-width:220px;
  }

  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px;
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  nav.tabs button{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:.85rem;
    font-weight:600;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-sunken); color:var(--text); }
  nav.tabs button[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  nav.tabs svg{ flex:none; }

  .panel{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:760px){
    .panel{ grid-template-columns:280px 1fr; align-items:start; }
    .panel.single{ grid-template-columns:1fr; max-width:520px; margin:0 auto; }
  }

  /* No celular a grade vem antes do formulário de cadastro (o que o
     coordenador quer ver primeiro); no desktop o formulário volta a
     ficar na coluna estreita à esquerda, grade na coluna larga. */
  .panel-horarios .card-grade{ order:1; }
  .panel-horarios .card-form{ order:2; }
  @media (min-width:760px){
    .panel-horarios .card-form{ order:1; }
    .panel-horarios .card-grade{ order:2; }
  }
  .card-form summary::-webkit-details-marker{ display:none; }
  .card-form[open] summary span:last-child{ transform:rotate(180deg); }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:1rem;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
  }

  form{ display:flex; flex-direction:column; gap:12px; }
  .field label{
    display:block;
    font-size:.72rem;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  input,select,textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:9px 10px;
    font-size:.88rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{ resize:vertical; min-height:88px; }

  .btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-whats{ background:var(--whats); color:var(--whats-ink); }
  .btn-whats:hover{ filter:brightness(1.05); }
  .btn-whats[disabled]{ opacity:.45; cursor:not-allowed; }

  .empty{ color:var(--text-muted); font-size:.85rem; }

  .list{ display:grid; gap:10px; }
  @media (min-width:640px){ .list.two-col{ grid-template-columns:1fr 1fr; } }

  .row{
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .row .name{ font-weight:700; font-size:.92rem; }
  .row .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:6px;
    font-size:.75rem;
    color:var(--text-muted);
  }
  .row .meta span{ display:flex; align-items:center; gap:4px; }
  .row .meta svg{ flex:none; opacity:.8; }
  .row .stack{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }

  .icon-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    flex:none;
  }
  .icon-btn:hover{ color:var(--danger); background:var(--surface); }

  .pill{
    display:inline-block;
    background:var(--chip);
    color:var(--chip-ink);
    font-size:.68rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .toggle-group{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toggle{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:10px;
    padding:9px;
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .toggle[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .note{
    font-size:.78rem;
    color:var(--text-muted);
    background:var(--surface-sunken);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    line-height:1.45;
  }
  .error{ color:var(--danger); font-size:.82rem; }

  .filterbar{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .search-wrap{ position:relative; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none; }
  .search-wrap input{ padding-left:34px; }
  .daypills{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .daypill{
    flex:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:999px;
    padding:6px 13px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
  }
  .daypill[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .daypill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .day-group + .day-group{ margin-top:20px; }
  .day-group-header{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.05rem;
    font-weight:700;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .day-group-header .count{ font-family:inherit; font-size:.72rem; font-weight:600; color:var(--text-muted); }
  .time-group + .time-group{ margin-top:14px; }
  .time-group-header{
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-muted);
    margin:0 0 6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .row-compact{ padding:9px 12px; }
  .row-compact .name{ font-size:.85rem; }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .badge-aguardando{ background:var(--warn-bg); color:var(--warn-ink); }
  .badge-confirmado{ background:var(--ok-bg); color:var(--ok-ink); }
  .icon-btn.whats-row{ color:var(--whats); }
  .icon-btn.whats-row:hover{ color:var(--whats); background:var(--surface); opacity:.8; }

  .dash-grid{ display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:760px){ .dash-grid{ grid-template-columns:1fr 1fr; } }
  .dash-card h3{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.05rem;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dash-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-top:1px solid var(--border);
  }
  .dash-item:first-of-type{ border-top:none; padding-top:0; }
  .stat-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .stat-tile{
    flex:1;
    min-width:120px;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat-tile .num{ font-family:ui-serif,Georgia,serif; font-size:1.7rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat-tile .label{ font-size:.75rem; color:var(--text-muted); margin-top:2px; }
  .grupos-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:0 20px 14px;
  }
  .grupos-bar .btn{ padding:8px 14px; font-size:.85rem; }
  .grupos-config{
    max-width:640px;
    margin:0 20px 14px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface-sunken);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .gate{
    max-width:360px;
    margin:15vh auto 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .gate h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.4rem;
    margin:0;
    text-align:center;
  }
  .spinner{
    width:18px; height:18px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>

  const DIA_SEMANA_NUM = { 'Domingo':0, 'Segunda':1, 'Terça':2, 'Quarta':3, 'Quinta':4, 'Sexta':5, 'Sábado':6 };

  function proximaDataPara(diaNome){
    const alvo = DIA_SEMANA_NUM[diaNome];
    if (alvo === undefined) return '';
    const hoje = new Date();
    for (let i = 0; i < 7; i++){
      const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
      if (d.getDay() === alvo) return isoDate(d);
    }
    return '';
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatarDataBR(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-');
    return `${d}/${m}/${a}`;
  }
  function diaSemanaDaData(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-').map(Number);
    const dt = new Date(a, m-1, d);
    return Object.keys(DIA_SEMANA_NUM).find(k => DIA_SEMANA_NUM[k] === dt.getDay());
  }

  function horariosFiltrados(){
    const f = state.filtroHorarios;
    const buscaLower = f.busca.trim().toLowerCase();
    let rows = state.horarios.filter(item => {
      if (f.dia !== 'Todos' && item.dia !== f.dia) return false;
      if (buscaLower) {
        const alvo = (item.professor + ' ' + item.turma + ' ' + item.disciplina).toLowerCase();
        if (!alvo.includes(buscaLower)) return false;
      }
      return true;
    });
    const ordemDia = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    rows.sort((a,b) => {
      const d = ordemDia.indexOf(a.dia) - ordemDia.indexOf(b.dia);
      if (d !== 0) return d;
      if (a.horario !== b.horario) return a.horario.localeCompare(b.horario);
      return a.turma.localeCompare(b.turma, 'pt-BR');
    });
    return rows;
  }

      grupo.itens.push(item);

      const porHorario = [];

  function candidatosSubstituicao(){
    const s = state.substituicao;
    const profAusente = state.professores.find(p => String(p.id) === String(s.professorAusenteId));
    const aulasDoAusente = profAusente ? state.horarios.filter(h => h.professor === profAusente.nome) : [];
    const aulaAusente = aulasDoAusente.find(h => String(h.id) === String(s.aulaAusenteId));

    let candidatos = [];
    if (profAusente && aulaAusente) {
      // Professores que lecionam para a mesma turma...
      const nomesDaTurma = new Set(
        state.horarios.filter(h => h.turma === aulaAusente.turma && h.professor !== profAusente.nome).map(h => h.professor)
      );
      // ...e que não têm nenhuma aula própria alocada nesse dia+horário exatos.
      candidatos = Array.from(nomesDaTurma).filter(nome => {
        const ocupado = state.horarios.some(h => h.professor === nome && h.dia === aulaAusente.dia && h.horario === aulaAusente.horario);
        return !ocupado;
      }).map(nome => {
        const aulaNaTurma = state.horarios.find(h => h.professor === nome && h.turma === aulaAusente.turma);
        return { nome, disciplina: aulaNaTurma ? aulaNaTurma.disciplina : '' };
      }).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    }

    const substituto = candidatos.find(c => c.nome === s.substitutoNome);
    return { profAusente, aulasDoAusente, aulaAusente, candidatos, substituto };
  }

      `A aula será assumida pelo(a) Prof.(a) ${row.professor_substituto}, que ministrará a disciplina de ${row.disciplina_substituto || '(a definir)'} neste horário.` +

  function renderSubstituicao(){
    const s = state.substituicao;
    const d = candidatosSubstituicao();
    const diaEsperado = d.aulaAusente ? d.aulaAusente.dia : '';
    const diaDaDataEscolhida = s.data ? diaSemanaDaData(s.data) : '';
    const dataDivergente = d.aulaAusente && s.data && diaDaDataEscolhida !== diaEsperado;

    const registros = [...state.substituicoes].sort((a,b) => (b.data||'').localeCompare(a.data||''));

    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.swap} Registrar falta e achar substituto</h2>
        <form id="form-subst">
        <div class="field">
          <label>Professor ausente</label>
          ${state.professores.length === 0 ? `<p class="note">Cadastre professores primeiro.</p>` : `
          <select id="s-professor">
            <option value="">-- Selecione --</option>
            ${state.professores.map(p => `<option value="${p.id}" ${String(s.professorAusenteId)===String(p.id)?'selected':''}>${esc(p.nome)}</option>`).join('')}
          </select>`}
        </div>
        ${d.profAusente ? `
        <div class="field">
          <label>Aula que vai faltar</label>
          ${d.aulasDoAusente.length === 0 ? `<p class="note">Esse professor não tem nenhuma aula alocada na grade.</p>` : `
          <select id="s-aula">
            <option value="">-- Selecione --</option>
            ${d.aulasDoAusente.map(h => `<option value="${h.id}" ${String(s.aulaAusenteId)===String(h.id)?'selected':''}>${esc(h.dia)} ${esc(h.horario)} — ${esc(h.turma)}${h.disciplina ? ' — '+esc(h.disciplina) : ''}</option>`).join('')}
          </select>`}
        </div>` : ''}
        ${d.aulaAusente ? `
        <div class="field">
          <label>Data da falta</label>
          <input type="date" id="s-data" value="${esc(s.data)}">
          ${dataDivergente ? `<p class="note">Essa data cai numa ${esc(diaDaDataEscolhida)}, mas a aula selecionada é de ${esc(diaEsperado)} — confira a data.</p>` : ''}
        </div>
        <div class="field">
          <label>Substituto (livre nesse horário, já dá aula pra essa turma)</label>
          ${d.candidatos.length === 0 ? `<p class="note">Nenhum outro professor dessa turma está livre em ${esc(d.aulaAusente.dia)} ${esc(d.aulaAusente.horario)}.</p>` : `
          <select id="s-substituto">
            <option value="">-- Selecione --</option>
            ${d.candidatos.map(c => `<option value="${esc(c.nome)}" ${s.substitutoNome===c.nome?'selected':''}>${esc(c.nome)}${c.disciplina ? ' — '+esc(c.disciplina) : ''}</option>`).join('')}
          </select>`}
        </div>
        <div class="field">
          <label>Observação (opcional)</label>
          <textarea id="s-obs" rows="2">${esc(s.observacao)}</textarea>
        </div>
        <button type="submit" class="btn btn-primary" ${d.substituto && s.data ? '' : 'disabled'}>${ICONS.plus} Registrar substituição</button>
        ` : ''}
        </form>
      </div>
      <div class="card">
        <h2>Substituições registradas <span class="pill" style="text-transform:none;font-weight:600">${registros.length}</span></h2>
        ${registros.length === 0 ? `<p class="empty">Nenhuma substituição registrada ainda.</p>` : `
        <div class="list">
          ${registros.map(row => `
            <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
              <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div>
                  <div class="name">${esc(row.turma)} — ${esc(formatarDataBR(row.data))} ${esc(row.horario)}</div>
                  <div class="stack meta">
                    <span>Ausente: ${esc(row.professor_ausente)}${row.disciplina_ausente ? ' ('+esc(row.disciplina_ausente)+')' : ''}</span>
                    <span>Substituto: ${esc(row.professor_substituto)}${row.disciplina_substituto ? ' ('+esc(row.disciplina_substituto)+')' : ''}</span>
                    ${row.observacao ? `<span>Obs.: ${esc(row.observacao)}</span>` : ''}
                  </div>
                </div>
                <span class="badge ${row.status==='confirmado' ? 'badge-confirmado' : 'badge-aguardando'}">${row.status==='confirmado' ? ICONS.check+' Confirmado pelo substituto' : 'Aguardando aceite'}</span>
              </div>
              <div class="toggle-group">
                ${row.status==='confirmado'
                  ? `<button type="button" class="btn" data-reabrir-subst="${row.id}" style="background:var(--surface-sunken);color:var(--text)">${ICONS.undo} Reabrir</button>`
                  : `<button type="button" class="btn btn-primary" data-confirmar-subst="${row.id}">${ICONS.check} Confirmar</button>`}
                <button type="button" class="btn" data-copiar-subst="${row.id}" style="background:var(--surface-sunken);color:var(--text)">${ICONS.copy} Copiar aviso</button>
                <a class="btn btn-whats" href="${buildSubstWhatsLink(row)}" target="_blank" rel="noopener noreferrer" ${buildSubstWhatsLink(row)==='#' ? 'aria-disabled="true" style="pointer-events:none;opacity:.45;"' : ''}>${ICONS.send} WhatsApp p/ líder</a>
                <button type="button" class="btn" data-del-subst="${row.id}" style="background:var(--surface-sunken);color:var(--text)">${ICONS.trash} Excluir</button>
              </div>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function alunosTccFiltrados(){
    const busca = state.filtroAlunosTcc.busca.trim().toLowerCase();
    if (!busca) return state.alunosTcc;
    return state.alunosTcc.filter(a =>
      (a.nome||'').toLowerCase().includes(busca) || (a.tema||'').toLowerCase().includes(busca));
  }

  function renderAgenda(){
    const editando = !!state.novoCompromisso.id;
    const hoje = hojeIso();
    const amanha = amanhaIso();
    const todos = [...state.compromissos].sort((a,b) => (a.data||'').localeCompare(b.data||'') || (a.hora||'').localeCompare(b.hora||''));
    const countVespera = todos.filter(c => c.data === amanha).length;
    const modo = state.filtroAgenda.modo;
    const rows = modo === 'hoje' ? todos.filter(c => c.data === hoje)
      : modo === 'vespera' ? todos.filter(c => c.data === amanha)
      : todos;
    const filtros = [
      { id:'todos', label:'Todos' },
      { id:'hoje', label:'Hoje' },
      { id:'vespera', label:'Véspera (Amanhã)', badge: countVespera }
    ];
    return `
    <div class="panel">
      <form class="card" id="form-compromisso">
        <h2>${editando ? ICONS.edit : ICONS.plus} ${editando ? 'Editar Compromisso' : 'Novo Compromisso'}</h2>
        <div class="field"><label>Título</label><input id="c-titulo" value="${esc(state.novoCompromisso.titulo)}"></div>
        <div class="field"><label>Data</label><input type="date" id="c-data" value="${esc(state.novoCompromisso.data)}"></div>
        <div class="field"><label>Hora</label><input id="c-hora" placeholder="Ex: 14:00" value="${esc(state.novoCompromisso.hora)}"></div>
        <div class="field"><label>Descrição</label><textarea id="c-descricao" rows="3">${esc(state.novoCompromisso.descricao)}</textarea></div>
        <div class="toggle-group">
          <button type="submit" class="btn btn-primary">${editando ? 'Salvar alterações' : 'Salvar compromisso'}</button>
          ${editando ? `<button type="button" class="btn" id="c-cancelar" style="background:var(--surface-sunken);color:var(--text)">Cancelar</button>` : ''}
        </div>
      </form>
      <div class="card">
        <h2>Agenda de compromissos <span class="pill" style="text-transform:none;font-weight:600">${todos.length}</span></h2>
        <div class="toggle-group" style="margin-bottom:12px">
          ${filtros.map(f => `
            <button type="button" class="toggle" data-agenda-filtro="${f.id}" aria-pressed="${modo===f.id}">
              ${esc(f.label)}${f.badge ? ` <span class="badge badge-aguardando" style="margin-left:4px">${f.badge}</span>` : ''}
            </button>`).join('')}
        </div>
        ${rows.length===0 ? `<p class="empty">${modo==='vespera' ? 'Nenhum compromisso agendado para amanhã.' : modo==='hoje' ? 'Nenhum compromisso agendado para hoje.' : 'Nenhum compromisso cadastrado.'}</p>` : `
        <div class="list">
          ${rows.map(c => `
            <div class="row">
              <div>
                <div class="name">${c.data===hoje ? '<span class="badge badge-confirmado">Hoje</span> ' : c.data===amanha ? '<span class="badge badge-aguardando">Amanhã</span> ' : ''}${esc(formatarDataBR(c.data))}${c.hora ? ' — '+esc(c.hora) : ''} — ${esc(c.titulo)}</div>
                ${c.descricao ? `<div class="meta">${esc(c.descricao)}</div>` : ''}
              </div>
              <div style="display:flex;gap:2px">
                <button class="icon-btn" data-edit-compromisso="${c.id}" aria-label="Editar compromisso">${ICONS.edit}</button>
                <button class="icon-btn" data-del-compromisso="${c.id}" aria-label="Remover compromisso">${ICONS.trash}</button>
              </div>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function renderPainel(){

    const diaHoje = diaDeHoje;
    const aulasHoje = state.horarios.filter(h => h.dia === diaHoje).sort((a,b)=>a.horario.localeCompare(b.horario));
    const substHoje = state.substituicoes.filter(s => s.data === hoje);
    const compromissosHoje = state.compromissos.filter(c => c.data === hoje).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const aguardando = state.substituicoes.filter(s => s.status === 'aguardando').length;

    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.home} Painel Matinal — ${esc(diaHoje)}, ${esc(formatarDataBR(hoje))}</h2>
        <div class="stat-row">
          <div class="stat-tile"><span class="num">${aulasHoje.length}</span><span class="label">Aulas hoje</span></div>
          <div class="stat-tile"><span class="num">${substHoje.length}</span><span class="label">Substituições hoje</span></div>
          <div class="stat-tile"><span class="num">${aguardando}</span><span class="label">Aguardando aceite</span></div>
          <div class="stat-tile"><span class="num">${compromissosHoje.length}</span><span class="label">Compromissos hoje</span></div>

              <div class="meta">${esc(s.professor_ausente)} → ${esc(s.professor_substituto)}</div>
              <span class="badge ${s.status==='confirmado' ? 'badge-confirmado' : 'badge-aguardando'}">${s.status==='confirmado' ? 'Confirmado' : 'Aguardando aceite'}</span>

          <h3>${ICONS.calendar} Compromissos de hoje</h3>
          ${compromissosHoje.length===0 ? `<p class="empty">Nenhum compromisso pra hoje.</p>` : compromissosHoje.map(c => `
            <div class="dash-item">

      <div class="card">

        <div class="list two-col">

              <div>

                <div class="meta"><span>${esc(h.professor)}${h.disciplina ? ' — '+esc(h.disciplina) : ''}</span></div>
              </div>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;

  function renderMensagens(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const hasPhone = !!(selected && selected.telefone);
    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.send} Enviar mensagem rápida via WhatsApp</h2>
        <div class="toggle-group" style="margin-bottom:12px">
          <button type="button" class="toggle" id="tog-lider" aria-pressed="${state.mensagem.destinatarioTipo==='lider'}">Para líder de turma</button>
          <button type="button" class="toggle" id="tog-prof" aria-pressed="${state.mensagem.destinatarioTipo==='prof'}">Para professor</button>
        </div>
        <div class="field">
          <label>Destinatário</label>
          <select id="m-dest">
            <option value="">-- Selecione --</option>
            ${list.map(x => `<option value="${x.id}" ${String(state.mensagem.id)===String(x.id)?'selected':''}>${state.mensagem.destinatarioTipo==='lider' ? esc(x.periodo)+' — '+esc(x.nome) : esc(x.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Mensagem / lembrete</label>
          <textarea id="m-texto" placeholder="Digite o aviso ou lembrete...">${esc(state.mensagem.texto)}</textarea>
        </div>
        ${selected && !hasPhone ? `<p class="note">Esse destinatário não tem telefone cadastrado — edite o cadastro antes de enviar.</p>` : ''}
        <a class="btn btn-whats" id="m-send" href="#" target="_blank" rel="noopener noreferrer" ${hasPhone ? '' : 'aria-disabled="true"'} style="${hasPhone ? '' : 'pointer-events:none;opacity:.45;'}">${ICONS.send} Abrir no WhatsApp</a>
      </div>
    </div>`;
  }

  function renderAll(){
    renderTabs();
    renderGruposBar();
    const panel = document.getElementById('tabpanel');
    if (state.activeTab === 'painel') panel.innerHTML = renderPainel();
    else if (state.activeTab === 'horarios') panel.innerHTML = renderHorarios();
    else if (state.activeTab === 'professores') panel.innerHTML = renderProfessores();
    else if (state.activeTab === 'lideres') panel.innerHTML = renderLideres();
    else if (state.activeTab === 'substituicao') panel.innerHTML = renderSubstituicao();
    else if (state.activeTab === 'alunostcc') panel.innerHTML = renderAlunosTcc();
    else if (state.activeTab === 'agenda') panel.innerHTML = renderAgenda();
    else panel.innerHTML = renderMensagens();
    bind();
  }

  function bind(){
    if (state.activeTab === 'horarios') {
      const f = document.getElementById('form-horario');
      const profSel = document.getElementById('h-professor');
      if (profSel) profSel.addEventListener('change', e=>{ state.novoHorario.professor = e.target.value; });
      ['h-dia','h-horario','h-turma','h-disciplina'].forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          const map = {'h-dia':'dia','h-horario':'horario','h-turma':'turma','h-disciplina':'disciplina'};
          state.novoHorario[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoHorario.professor || !state.novoHorario.horario) return;
        const conflitoProfessor = state.horarios.some(h => h.professor===state.novoHorario.professor && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
        if (conflitoProfessor) { alert(state.novoHorario.professor + ' já tem uma aula alocada nesse dia e horário.'); return; }
        const turmaLimpa = state.novoHorario.turma.trim();
        if (turmaLimpa) {
          const conflitoTurma = state.horarios.some(h => h.turma.trim()===turmaLimpa && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
          if (conflitoTurma) { alert('A turma ' + turmaLimpa + ' já está ocupada nesse dia e horário.'); return; }
        }
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoHorario.id;
        const args = {
          p_senha: state.senha, p_professor: state.novoHorario.professor, p_dia: state.novoHorario.dia,
          p_horario: state.novoHorario.horario, p_turma: state.novoHorario.turma, p_disciplina: state.novoHorario.disciplina
        };
        const { error } = editando
          ? await sb.rpc('fest_update_horario', { ...args, p_id: editando })
          : await sb.rpc('fest_add_horario', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoHorario = { id:null, professor:'', dia:'Segunda', horario:'', turma:'', disciplina:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('h-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoHorario = { id:null, professor:'', dia:'Segunda', horario:'', turma:'', disciplina:'' };
        renderAll();
      });
      bindResultadosHorarios();
      const buscaInput = document.getElementById('h-busca');
      if (buscaInput) buscaInput.addEventListener('input', e=>{
        state.filtroHorarios.busca = e.target.value;
        document.getElementById('h-resultados').innerHTML = renderHorariosResultados();
        bindResultadosHorarios();
      });
      panel_query('.daypill').forEach(b=>b.addEventListener('click', ()=>{
        state.filtroHorarios.dia = b.dataset.dia;
        renderAll();
      }));
    }
    if (state.activeTab === 'professores') {
      const f = document.getElementById('form-prof');
      const map = {'p-nome':'nome','p-matricula':'matricula','p-cpf':'cpf','p-data':'dataNasc','p-email':'email','p-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'p-cpf') v = maskCpf(v);
          if (id === 'p-telefone') v = maskTelefone(v);
          state.novoProf[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoProf.nome) return;
        const cpfLimpo = state.novoProf.cpf.replace(/\D/g,'');
        const editando = state.novoProf.id;
        if (cpfLimpo && state.professores.some(p => p.cpf.replace(/\D/g,'') === cpfLimpo && String(p.id) !== String(editando))) {
          alert('Já existe um professor cadastrado com esse CPF.');
          return;
        }
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const args = {
          p_senha: state.senha, p_nome: state.novoProf.nome, p_matricula: state.novoProf.matricula, p_cpf: state.novoProf.cpf,
          p_data_nasc: state.novoProf.dataNasc, p_email: state.novoProf.email, p_telefone: state.novoProf.telefone
        };
        const { error } = editando
          ? await sb.rpc('fest_update_professor', { ...args, p_id: editando })
          : await sb.rpc('fest_add_professor', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoProf = { id:null, nome:'', matricula:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('p-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoProf = { id:null, nome:'', matricula:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        renderAll();
      });
      panel_query('[data-edit-prof]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.professores.find(p => String(p.id) === b.dataset.editProf);
        if (!item) return;
        state.novoProf = { id:item.id, nome:item.nome, matricula:item.matricula, cpf:item.cpf, dataNasc:item.data_nasc, email:item.email, telefone:item.telefone };
        renderAll();
        document.getElementById('p-nome')?.focus();
      }));
      panel_query('[data-addwhats-prof]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.professores.find(p => String(p.id) === b.dataset.addwhatsProf);
        if (!item) return;
        state.novoProf = { id:item.id, nome:item.nome, matricula:item.matricula, cpf:item.cpf, dataNasc:item.data_nasc, email:item.email, telefone:item.telefone };
        renderAll();
        document.getElementById('p-telefone')?.focus();
      }));
      panel_query('[data-del-prof]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este professor do cadastro?')) return;
        const { error } = await sb.rpc('fest_delete_professor', { p_senha: state.senha, p_id: b.dataset.delProf });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
    }
    if (state.activeTab === 'lideres') {
      const f = document.getElementById('form-lider');
      const map = {'l-periodo':'periodo','l-nome':'nome','l-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'l-telefone') v = maskTelefone(v);
          state.novoLider[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoLider.periodo || !state.novoLider.nome) return;
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoLider.id;
        const args = { p_senha: state.senha, p_periodo: state.novoLider.periodo, p_nome: state.novoLider.nome, p_telefone: state.novoLider.telefone };
        const { error } = editando
          ? await sb.rpc('fest_update_lider', { ...args, p_id: editando })
          : await sb.rpc('fest_add_lider', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoLider = { id:null, periodo:'', nome:'', telefone:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('l-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoLider = { id:null, periodo:'', nome:'', telefone:'' };
        renderAll();
      });
      panel_query('[data-edit-lider]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.lideres.find(l => String(l.id) === b.dataset.editLider);
        if (!item) return;
        state.novoLider = { id:item.id, periodo:item.periodo, nome:item.nome, telefone:item.telefone };
        renderAll();
      }));
      panel_query('[data-del-lider]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este líder de turma?')) return;
        const { error } = await sb.rpc('fest_delete_lider', { p_senha: state.senha, p_id: b.dataset.delLider });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
    }
    if (state.activeTab === 'substituicao') {
      const s = state.substituicao;
      const profSel = document.getElementById('s-professor');
      if (profSel) profSel.addEventListener('change', e=>{
        state.substituicao = { professorAusenteId: e.target.value, aulaAusenteId:'', data:'', substitutoNome:'', observacao:'' };
        renderAll();
      });
      const aulaSel = document.getElementById('s-aula');
      if (aulaSel) aulaSel.addEventListener('change', e=>{
        s.aulaAusenteId = e.target.value;
        s.substitutoNome = '';
        const aula = state.horarios.find(h => String(h.id) === String(s.aulaAusenteId));
        s.data = aula ? proximaDataPara(aula.dia) : '';
        renderAll();
      });
      const dataInput = document.getElementById('s-data');
      if (dataInput) dataInput.addEventListener('input', e=>{
        s.data = e.target.value;
        renderAll();
      });
      const substSel = document.getElementById('s-substituto');
      if (substSel) substSel.addEventListener('change', e=>{
        s.substitutoNome = e.target.value;
        renderAll();
      });
      const obsArea = document.getElementById('s-obs');
      if (obsArea) obsArea.addEventListener('input', e=>{ s.observacao = e.target.value; });
      const formSubst = document.getElementById('form-subst');
      if (formSubst) formSubst.addEventListener('submit', async e=>{
        e.preventDefault();
        const d = candidatosSubstituicao();
        if (!d.aulaAusente || !d.substituto || !s.data) return;
        const btn = formSubst.querySelector('button[type=submit]');
        btn.disabled = true;
        const { error } = await sb.rpc('fest_add_substituicao', {
          p_senha: state.senha,
          p_professor_ausente: d.profAusente.nome,
          p_data: s.data,
          p_dia: d.aulaAusente.dia,
          p_horario: d.aulaAusente.horario,
          p_turma: d.aulaAusente.turma,
          p_disciplina_ausente: d.aulaAusente.disciplina || '',
          p_professor_substituto: d.substituto.nome,
          p_disciplina_substituto: d.substituto.disciplina || '',
          p_observacao: s.observacao || ''
        });
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.substituicao = { professorAusenteId:'', aulaAusenteId:'', data:'', substitutoNome:'', observacao:'' };
        await carregarDados(state.senha); renderAll();
      });
      panel_query('[data-confirmar-subst]').forEach(b=>b.addEventListener('click', async ()=>{
        const { error } = await sb.rpc('fest_confirmar_substituicao', { p_senha: state.senha, p_id: b.dataset.confirmarSubst });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
      panel_query('[data-reabrir-subst]').forEach(b=>b.addEventListener('click', async ()=>{
        const { error } = await sb.rpc('fest_reabrir_substituicao', { p_senha: state.senha, p_id: b.dataset.reabrirSubst });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
      panel_query('[data-del-subst]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Excluir este registro de substituição?')) return;
        const { error } = await sb.rpc('fest_delete_substituicao', { p_senha: state.senha, p_id: b.dataset.delSubst });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
      panel_query('[data-copiar-subst]').forEach(b=>b.addEventListener('click', async ()=>{
        const row = state.substituicoes.find(r => String(r.id) === b.dataset.copiarSubst);
        if (!row) return;
        try { await navigator.clipboard.writeText(textoSubstituicao(row)); b.textContent = 'Copiado!'; setTimeout(()=>{ b.innerHTML = ICONS.copy + ' Copiar aviso'; }, 1500); }
        catch(e){ alert('Não foi possível copiar automaticamente.'); }
      }));
    }
    if (state.activeTab === 'alunostcc') {
      const f = document.getElementById('form-alunotcc');
      const map = {'a-nome':'nome','a-periodo':'periodo','a-tema':'tema','a-email':'email'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          state.novoAlunoTcc[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if (!state.novoAlunoTcc.nome) return;
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoAlunoTcc.id;
        const args = { p_senha: state.senha, p_nome: state.novoAlunoTcc.nome, p_periodo: state.novoAlunoTcc.periodo, p_tema: state.novoAlunoTcc.tema, p_email: state.novoAlunoTcc.email };
        const { error } = editando
          ? await sb.rpc('fest_update_aluno_tcc', { ...args, p_id: editando })
          : await sb.rpc('fest_add_aluno_tcc', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoAlunoTcc = { id:null, nome:'', periodo:'10º', tema:'', email:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('a-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoAlunoTcc = { id:null, nome:'', periodo:'10º', tema:'', email:'' };
        renderAll();
      });
      document.getElementById('a-busca').addEventListener('input', e=>{
        state.filtroAlunosTcc.busca = e.target.value;
        renderAll();
      });
      panel_query('[data-edit-alunotcc]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.alunosTcc.find(a => String(a.id) === b.dataset.editAlunotcc);
        if (!item) return;
        state.novoAlunoTcc = { id:item.id, nome:item.nome, periodo:item.periodo, tema:item.tema, email:item.email };
        renderAll();
      }));
      panel_query('[data-del-alunotcc]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este aluno da lista de TCC?')) return;
        const { error } = await sb.rpc('fest_delete_aluno_tcc', { p_senha: state.senha, p_id: b.dataset.delAlunotcc });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
    }
    if (state.activeTab === 'agenda') {
      const f = document.getElementById('form-compromisso');
      const map = {'c-titulo':'titulo','c-data':'data','c-hora':'hora','c-descricao':'descricao'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          state.novoCompromisso[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if (!state.novoCompromisso.titulo || !state.novoCompromisso.data) return;
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoCompromisso.id;
        const args = { p_senha: state.senha, p_titulo: state.novoCompromisso.titulo, p_data: state.novoCompromisso.data, p_hora: state.novoCompromisso.hora, p_descricao: state.novoCompromisso.descricao };
        const { error } = editando
          ? await sb.rpc('fest_update_compromisso', { ...args, p_id: editando })
          : await sb.rpc('fest_add_compromisso', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoCompromisso = { id:null, titulo:'', data:'', hora:'', descricao:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('c-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoCompromisso = { id:null, titulo:'', data:'', hora:'', descricao:'' };
        renderAll();
      });
      panel_query('[data-edit-compromisso]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.compromissos.find(c => String(c.id) === b.dataset.editCompromisso);
        if (!item) return;
        state.novoCompromisso = { id:item.id, titulo:item.titulo, data:item.data, hora:item.hora, descricao:item.descricao };
        renderAll();
      }));
      panel_query('[data-del-compromisso]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este compromisso da agenda?')) return;
        const { error } = await sb.rpc('fest_delete_compromisso', { p_senha: state.senha, p_id: b.dataset.delCompromisso });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
      panel_query('[data-agenda-filtro]').forEach(b=>b.addEventListener('click', ()=>{
        state.filtroAgenda.modo = b.dataset.agendaFiltro;
        renderAll();
      }));
    }
    if (state.activeTab === 'mensagens') {
      document.getElementById('tog-lider').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'lider', id:'' };
        renderAll();
      });
      document.getElementById('tog-prof').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'prof', id:'' };
        renderAll();
      });
      document.getElementById('m-dest').addEventListener('change', e=>{
        state.mensagem.id = e.target.value; renderAll();
      });
      document.getElementById('m-texto').addEventListener('input', e=>{
        state.mensagem.texto = e.target.value;
        const link = document.getElementById('m-send');
        if (link) link.href = buildWhatsLink();
      });
      const link = document.getElementById('m-send');
      if (link) link.href = buildWhatsLink();
    }
  }

  function buildWhatsLink(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const num = (selected && selected.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(state.mensagem.texto)}`;
  }

  function panel_query(sel){ return Array.from(document.getElementById('tabpanel').querySelectorAll(sel)); }

  function bindResultadosHorarios(){
    panel_query('[data-edit-horario]').forEach(b=>b.addEventListener('click', ()=>{
      const item = state.horarios.find(h => String(h.id) === b.dataset.editHorario);
      if (!item) return;
      state.novoHorario = { id:item.id, professor:item.professor, dia:item.dia, horario:item.horario, turma:item.turma, disciplina:item.disciplina };
      renderAll();
    }));
    panel_query('[data-del-horario]').forEach(b=>b.addEventListener('click', async ()=>{
      if (!confirm('Remover este horário da grade?')) return;
      const { error } = await sb.rpc('fest_delete_horario', { p_senha: state.senha, p_id: b.dataset.delHorario });
      if (error) { alert(error.message); return; }
      await carregarDados(state.senha); renderAll();
    }));
  }

  boot();
})();
</script>
</body>
</html>
