<style>

    --accent:#38508C;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7ECF7;
    --whats:#1E8E5A;
    --whats-ink:#FFFFFF;
    --danger:#B5493B;
    --chip:#EFE6D4;

  }
  @media (prefers-color-scheme: dark){

      --surface:#1F2124;
      --surface-sunken:#26282C;
      --border:#33353A;
      --text:#EDEAE3;
      --text-muted:#9C978D;
      --accent:#8FA6E0;
      --accent-ink:#111318;
      --accent-soft:#28304A;
      --whats:#4FBE8C;
      --whats-ink:#0D1712;
      --danger:#E19082;
      --chip:#332C1C;
      --chip-ink:#E3C077;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#17181B;
    --surface:#1F2124;
    --surface-sunken:#26282C;
    --border:#33353A;
    --text:#EDEAE3;
    --text-muted:#9C978D;
    --accent:#8FA6E0;
    --accent-ink:#111318;
    --accent-soft:#28304A;
    --whats:#4FBE8C;
    --whats-ink:#0D1712;
    --danger:#E19082;
    --chip:#332C1C;
    --chip-ink:#E3C077;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.hero{
    background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black 10%));
    color:var(--accent-ink);
    border-radius:18px;
    padding:26px 28px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  header.hero h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.7rem;
    margin:0 0 4px;
    text-wrap:balance;
    font-weight:600;
  }
  header.hero p{
    margin:0;
    opacity:.82;
    font-size:.9rem;
  }
  .hero-meta{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.75;
    text-align:right;
    max-width:220px;
  }

  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px;
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  nav.tabs button{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:.85rem;
    font-weight:600;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-sunken); color:var(--text); }
  nav.tabs button[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  nav.tabs svg{ flex:none; }

  .panel{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:760px){
    .panel{ grid-template-columns:280px 1fr; align-items:start; }
    .panel.single{ grid-template-columns:1fr; max-width:520px; margin:0 auto; }
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:1rem;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
  }

  form{ display:flex; flex-direction:column; gap:12px; }
  .field label{
    display:block;
    font-size:.72rem;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  input,select,textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:9px 10px;
    font-size:.88rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{ resize:vertical; min-height:88px; }

  .btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-whats{ background:var(--whats); color:var(--whats-ink); }
  .btn-whats:hover{ filter:brightness(1.05); }
  .btn-whats[disabled]{ opacity:.45; cursor:not-allowed; }

  .empty{ color:var(--text-muted); font-size:.85rem; }

  .list{ display:grid; gap:10px; }
  @media (min-width:640px){ .list.two-col{ grid-template-columns:1fr 1fr; } }

  .row{
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .row .name{ font-weight:700; font-size:.92rem; }
  .row .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:6px;
    font-size:.75rem;
    color:var(--text-muted);
  }
  .row .meta span{ display:flex; align-items:center; gap:4px; }
  .row .meta svg{ flex:none; opacity:.8; }
  .row .stack{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }

  .icon-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    flex:none;
  }
  .icon-btn:hover{ color:var(--danger); background:var(--surface); }

  .pill{
    display:inline-block;
    background:var(--chip);
    color:var(--chip-ink);
    font-size:.68rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .toggle-group{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toggle{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:10px;
    padding:9px;
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .toggle[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .note{
    font-size:.78rem;
    color:var(--text-muted);
    background:var(--surface-sunken);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    line-height:1.45;
  }
</style>
</head>

  const DIA_SEMANA_NUM = { 'Domingo':0, 'Segunda':1, 'Terça':2, 'Quarta':3, 'Quinta':4, 'Sexta':5, 'Sábado':6 };

  function proximaDataPara(diaNome){
    const alvo = DIA_SEMANA_NUM[diaNome];
    if (alvo === undefined) return '';
    const hoje = new Date();
    for (let i = 0; i < 7; i++){
      const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
      if (d.getDay() === alvo) return isoDate(d);
    }
    return '';
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatarDataBR(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-');
    return `${d}/${m}/${a}`;
  }
  function diaSemanaDaData(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-').map(Number);
    const dt = new Date(a, m-1, d);
    return Object.keys(DIA_SEMANA_NUM).find(k => DIA_SEMANA_NUM[k] === dt.getDay());
  }

  function calcularSubstituicao(){
    const s = state.substituicao;
    const profAusente = state.professores.find(p => String(p.id) === String(s.professorAusenteId));
    const aulasDoAusente = profAusente ? state.horarios.filter(h => h.professor === profAusente.nome) : [];
    const aulaAusente = aulasDoAusente.find(h => String(h.id) === String(s.aulaAusenteId));

    let candidatos = [];
    if (profAusente && aulaAusente) {
      // Professores que lecionam para a mesma turma...
      const nomesDaTurma = new Set(
        state.horarios.filter(h => h.sala === aulaAusente.sala && h.professor !== profAusente.nome).map(h => h.professor)
      );
      // ...e que não têm nenhuma aula própria alocada nesse dia+horário exatos.
      candidatos = Array.from(nomesDaTurma).filter(nome => {
        const ocupado = state.horarios.some(h => h.professor === nome && h.dia === aulaAusente.dia && h.horario === aulaAusente.horario);
        return !ocupado;
      }).map(nome => {
        const aulaNaTurma = state.horarios.find(h => h.professor === nome && h.sala === aulaAusente.sala);
        return { nome, disciplina: aulaNaTurma ? aulaNaTurma.disciplina : '' };
      }).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    }

    const substituto = candidatos.find(c => c.nome === s.substitutoNome);

    let texto = '';
    if (profAusente && aulaAusente && substituto && s.data) {
      texto = `Aviso de Alteração na Grade Horária - ${aulaAusente.sala}\n\n` +
        `Informamos que no dia ${formatarDataBR(s.data)}, no horário das ${aulaAusente.horario}, o(a) Prof.(a) ${profAusente.nome}` +
        `${aulaAusente.disciplina ? ' (' + aulaAusente.disciplina + ')' : ''} precisará ausentar-se.\n\n` +
        `A aula será assumida pelo(a) Prof.(a) ${substituto.nome}, que ministrará a disciplina de ${substituto.disciplina || '(a definir)'} neste horário.`;
    }

    return { profAusente, aulasDoAusente, aulaAusente, candidatos, substituto, texto };
  }

  function renderSubstituicao(){
    const s = state.substituicao;
    const d = calcularSubstituicao();
    const textoFinal = s.textoEditado !== null ? s.textoEditado : d.texto;
    const diaEsperado = d.aulaAusente ? d.aulaAusente.dia : '';
    const diaDaDataEscolhida = s.data ? diaSemanaDaData(s.data) : '';
    const dataDivergente = d.aulaAusente && s.data && diaDaDataEscolhida !== diaEsperado;

    const lider = d.aulaAusente ? state.lideres.find(l => l.periodo === d.aulaAusente.sala) : null;

    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.swap} Registrar falta e achar substituto</h2>
        <div class="field">
          <label>Professor ausente</label>
          ${state.professores.length === 0 ? `<p class="note">Cadastre professores primeiro.</p>` : `
          <select id="s-professor">
            <option value="">-- Selecione --</option>
            ${state.professores.map(p => `<option value="${p.id}" ${String(s.professorAusenteId)===String(p.id)?'selected':''}>${esc(p.nome)}</option>`).join('')}
          </select>`}
        </div>
        ${d.profAusente ? `
        <div class="field">
          <label>Aula que vai faltar</label>
          ${d.aulasDoAusente.length === 0 ? `<p class="note">Esse professor não tem nenhuma aula alocada na grade.</p>` : `
          <select id="s-aula">
            <option value="">-- Selecione --</option>
            ${d.aulasDoAusente.map(h => `<option value="${h.id}" ${String(s.aulaAusenteId)===String(h.id)?'selected':''}>${esc(h.dia)} ${esc(h.horario)} — ${esc(h.sala)}${h.disciplina ? ' — '+esc(h.disciplina) : ''}</option>`).join('')}
          </select>`}
        </div>` : ''}
        ${d.aulaAusente ? `
        <div class="field">
          <label>Data da falta</label>
          <input type="date" id="s-data" value="${esc(s.data)}">
          ${dataDivergente ? `<p class="note">Essa data cai numa ${esc(diaDaDataEscolhida)}, mas a aula selecionada é de ${esc(diaEsperado)} — confira a data.</p>` : ''}
        </div>
        <div class="field">
          <label>Substituto (livre nesse horário, já dá aula pra essa turma)</label>
          ${d.candidatos.length === 0 ? `<p class="note">Nenhum outro professor dessa turma está livre em ${esc(d.aulaAusente.dia)} ${esc(d.aulaAusente.horario)}.</p>` : `
          <select id="s-substituto">
            <option value="">-- Selecione --</option>
            ${d.candidatos.map(c => `<option value="${esc(c.nome)}" ${s.substitutoNome===c.nome?'selected':''}>${esc(c.nome)}${c.disciplina ? ' — '+esc(c.disciplina) : ''}</option>`).join('')}
          </select>`}
        </div>` : ''}
        ${d.substituto && s.data ? `
        <div class="field">
          <label>Comunicado (editável)</label>
          <textarea id="s-texto" rows="6">${esc(textoFinal)}</textarea>
        </div>
        <div class="toggle-group">
          <button type="button" class="btn btn-primary" id="s-copiar">${ICONS.copy} Copiar texto</button>
          <a class="btn btn-whats" id="s-whats" href="#" target="_blank" rel="noopener noreferrer" ${lider && lider.telefone ? '' : 'aria-disabled="true"'} style="${lider && lider.telefone ? '' : 'pointer-events:none;opacity:.45;'}">${ICONS.send} WhatsApp p/ líder</a>
        </div>
        ${!lider ? `<p class="note">Não há líder cadastrado pra turma "${esc(d.aulaAusente.sala)}" — cadastre um na aba Líderes pra habilitar o envio direto.</p>` : ''}
        ` : ''}
      </div>
    </div>`;
  }

  function renderMensagens(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const hasPhone = !!(selected && selected.telefone);
    return `
    <div class="panel single">
      <div class="card">
        <h2>${ICONS.send} Enviar mensagem rápida via WhatsApp</h2>
        <div class="toggle-group" style="margin-bottom:12px">
          <button type="button" class="toggle" id="tog-lider" aria-pressed="${state.mensagem.destinatarioTipo==='lider'}">Para líder de turma</button>
          <button type="button" class="toggle" id="tog-prof" aria-pressed="${state.mensagem.destinatarioTipo==='prof'}">Para professor</button>
        </div>
        <div class="field">
          <label>Destinatário</label>
          <select id="m-dest">
            <option value="">-- Selecione --</option>
            ${list.map(x => `<option value="${x.id}" ${String(state.mensagem.id)===String(x.id)?'selected':''}>${state.mensagem.destinatarioTipo==='lider' ? esc(x.periodo)+' — '+esc(x.nome) : esc(x.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Mensagem / lembrete</label>
          <textarea id="m-texto" placeholder="Digite o aviso ou lembrete...">${esc(state.mensagem.texto)}</textarea>
        </div>
        ${selected && !hasPhone ? `<p class="note">Esse destinatário não tem telefone cadastrado — edite o cadastro antes de enviar.</p>` : ''}
        <a class="btn btn-whats" id="m-send" href="#" target="_blank" rel="noopener noreferrer" ${hasPhone ? '' : 'aria-disabled="true"'} style="${hasPhone ? '' : 'pointer-events:none;opacity:.45;'}">${ICONS.send} Abrir no WhatsApp</a>
      </div>
    </div>`;
  }

  function renderAll(){
    renderTabs();
    const panel = document.getElementById('tabpanel');
    if (state.activeTab === 'horarios') panel.innerHTML = renderHorarios();
    else if (state.activeTab === 'professores') panel.innerHTML = renderProfessores();
    else if (state.activeTab === 'lideres') panel.innerHTML = renderLideres();
    else if (state.activeTab === 'substituicao') panel.innerHTML = renderSubstituicao();
    else panel.innerHTML = renderMensagens();
    bind();
  }

  function bind(){
    if (state.activeTab === 'horarios') {
      const f = document.getElementById('form-horario');
      const profSel = document.getElementById('h-professor');
      if (profSel) profSel.addEventListener('change', e=>{ state.novoHorario.professor = e.target.value; });
      ['h-dia','h-horario','h-sala','h-disciplina'].forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          const map = {'h-dia':'dia','h-horario':'horario','h-sala':'sala','h-disciplina':'disciplina'};
          state.novoHorario[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoHorario.professor || !state.novoHorario.horario) return;
        const conflitoProfessor = state.horarios.some(h => h.professor===state.novoHorario.professor && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
        if (conflitoProfessor) { alert(state.novoHorario.professor + ' já tem uma aula alocada nesse dia e horário.'); return; }
        const salaLimpa = state.novoHorario.sala.trim();
        if (salaLimpa) {
          const conflitoSala = state.horarios.some(h => h.sala.trim()===salaLimpa && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
          if (conflitoSala) { alert('A turma ' + salaLimpa + ' já está ocupada nesse dia e horário.'); return; }
        }
        state.horarios.push({...state.novoHorario, id:genId()});
        state.novoHorario = { professor:'', dia:'Segunda', horario:'', sala:'', disciplina:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-horario]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este horário da grade?')) return;
        state.horarios = state.horarios.filter(h=>String(h.id)!==b.dataset.delHorario);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'professores') {
      const f = document.getElementById('form-prof');
      const map = {'p-nome':'nome','p-cpf':'cpf','p-data':'dataNasc','p-email':'email','p-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'p-cpf') v = maskCpf(v);
          if (id === 'p-telefone') v = maskTelefone(v);
          state.novoProf[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoProf.nome) return;
        const cpfLimpo = state.novoProf.cpf.replace(/\D/g,'');
        if (cpfLimpo && state.professores.some(p => p.cpf.replace(/\D/g,'') === cpfLimpo)) {
          alert('Já existe um professor cadastrado com esse CPF.');
          return;
        }
        state.professores.push({...state.novoProf, id:genId()});
        state.novoProf = { nome:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-prof]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este professor do cadastro?')) return;
        state.professores = state.professores.filter(p=>String(p.id)!==b.dataset.delProf);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'lideres') {
      const f = document.getElementById('form-lider');
      const map = {'l-periodo':'periodo','l-nome':'nome','l-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'l-telefone') v = maskTelefone(v);
          state.novoLider[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', e=>{
        e.preventDefault();
        if(!state.novoLider.periodo || !state.novoLider.nome) return;
        state.lideres.push({...state.novoLider, id:genId()});
        state.novoLider = { periodo:'', nome:'', telefone:'' };
        persist(); renderAll();
      });
      panel_query('[data-del-lider]').forEach(b=>b.addEventListener('click', ()=>{
        if (!confirm('Remover este líder de turma?')) return;
        state.lideres = state.lideres.filter(l=>String(l.id)!==b.dataset.delLider);
        persist(); renderAll();
      }));
    }
    if (state.activeTab === 'substituicao') {
      const s = state.substituicao;
      const profSel = document.getElementById('s-professor');
      if (profSel) profSel.addEventListener('change', e=>{
        state.substituicao = { professorAusenteId: e.target.value, aulaAusenteId:'', data:'', substitutoNome:'', textoEditado:null };
        renderAll();
      });
      const aulaSel = document.getElementById('s-aula');
      if (aulaSel) aulaSel.addEventListener('change', e=>{
        s.aulaAusenteId = e.target.value;
        s.substitutoNome = ''; s.textoEditado = null;
        const aula = state.horarios.find(h => String(h.id) === String(s.aulaAusenteId));
        s.data = aula ? proximaDataPara(aula.dia) : '';
        renderAll();
      });
      const dataInput = document.getElementById('s-data');
      if (dataInput) dataInput.addEventListener('input', e=>{
        s.data = e.target.value; s.textoEditado = null;
        renderAll();
      });
      const substSel = document.getElementById('s-substituto');
      if (substSel) substSel.addEventListener('change', e=>{
        s.substitutoNome = e.target.value; s.textoEditado = null;
        renderAll();
      });
      const textoArea = document.getElementById('s-texto');
      if (textoArea) textoArea.addEventListener('input', e=>{
        s.textoEditado = e.target.value;
        const whats = document.getElementById('s-whats');
        if (whats && !whats.hasAttribute('aria-disabled')) whats.href = buildSubstWhatsLink(e.target.value);
      });
      const copiarBtn = document.getElementById('s-copiar');
      if (copiarBtn) copiarBtn.addEventListener('click', async ()=>{
        const texto = document.getElementById('s-texto').value;
        try { await navigator.clipboard.writeText(texto); copiarBtn.textContent = 'Copiado!'; setTimeout(()=>{ copiarBtn.innerHTML = ICONS.copy + ' Copiar texto'; }, 1500); }
        catch(e){ alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.'); }
      });
      const whatsLink = document.getElementById('s-whats');
      if (whatsLink && !whatsLink.hasAttribute('aria-disabled')) {
        const texto = document.getElementById('s-texto') ? document.getElementById('s-texto').value : '';
        whatsLink.href = buildSubstWhatsLink(texto);
      }
    }
    if (state.activeTab === 'mensagens') {
      document.getElementById('tog-lider').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'lider', id:'' };
        renderAll();
      });
      document.getElementById('tog-prof').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'prof', id:'' };
        renderAll();
      });
      document.getElementById('m-dest').addEventListener('change', e=>{
        state.mensagem.id = e.target.value; renderAll();
      });
      document.getElementById('m-texto').addEventListener('input', e=>{
        state.mensagem.texto = e.target.value;
        const link = document.getElementById('m-send');
        if (link) link.href = buildWhatsLink();
      });
      const link = document.getElementById('m-send');
      if (link) link.href = buildWhatsLink();
    }
  }

  function buildSubstWhatsLink(texto){
    const d = calcularSubstituicao();
    const lider = d.aulaAusente ? state.lideres.find(l => l.periodo === d.aulaAusente.sala) : null;
    const num = (lider && lider.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(texto)}`;
  }

  function buildWhatsLink(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const num = (selected && selected.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(state.mensagem.texto)}`;
  }

  function panel_query(sel){ return Array.from(document.getElementById('tabpanel').querySelectorAll(sel)); }

  aplicarSeed2026_2();
  renderAll();
})();
</script>
</body>
</html>
