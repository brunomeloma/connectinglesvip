<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Coordenação — FEST</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ground:#F6F4EF;
    --surface:#FFFFFF;
    --surface-sunken:#F0EDE6;
    --border:#E3DFD5;
    --text:#242220;
    --text-muted:#736C5F;
    --accent:#38508C;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7ECF7;
    --whats:#1E8E5A;
    --whats-ink:#FFFFFF;
    --danger:#B5493B;
    --chip:#EFE6D4;
    --chip-ink:#7A5B21;
    --shadow: 0 1px 2px rgba(36,34,32,0.06), 0 8px 24px -12px rgba(36,34,32,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#17181B;
      --surface:#1F2124;
      --surface-sunken:#26282C;
      --border:#33353A;
      --text:#EDEAE3;
      --text-muted:#9C978D;
      --accent:#8FA6E0;
      --accent-ink:#111318;
      --accent-soft:#28304A;
      --whats:#4FBE8C;
      --whats-ink:#0D1712;
      --danger:#E19082;
      --chip:#332C1C;
      --chip-ink:#E3C077;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#17181B;
    --surface:#1F2124;
    --surface-sunken:#26282C;
    --border:#33353A;
    --text:#EDEAE3;
    --text-muted:#9C978D;
    --accent:#8FA6E0;
    --accent-ink:#111318;
    --accent-soft:#28304A;
    --whats:#4FBE8C;
    --whats-ink:#0D1712;
    --danger:#E19082;
    --chip:#332C1C;
    --chip-ink:#E3C077;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.hero{
    background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black 10%));
    color:var(--accent-ink);
    border-radius:18px;
    padding:26px 28px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  header.hero h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.7rem;
    margin:0 0 4px;
    text-wrap:balance;
    font-weight:600;
  }
  header.hero p{
    margin:0;
    opacity:.82;
    font-size:.9rem;
  }
  .hero-meta{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.75;
    text-align:right;
    max-width:220px;
  }

  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px;
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  nav.tabs button{
    display:flex;
    align-items:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:.85rem;
    font-weight:600;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-sunken); color:var(--text); }
  nav.tabs button[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  nav.tabs svg{ flex:none; }

  .panel{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:760px){
    .panel{ grid-template-columns:280px 1fr; align-items:start; }
    .panel.single{ grid-template-columns:1fr; max-width:520px; margin:0 auto; }
  }

  /* No celular a grade vem antes do formulário de cadastro (o que o
     coordenador quer ver primeiro); no desktop o formulário volta a
     ficar na coluna estreita à esquerda, grade na coluna larga. */
  .panel-horarios .card-grade{ order:1; }
  .panel-horarios .card-form{ order:2; }
  @media (min-width:760px){
    .panel-horarios .card-form{ order:1; }
    .panel-horarios .card-grade{ order:2; }
  }
  .card-form summary::-webkit-details-marker{ display:none; }
  .card-form[open] summary span:last-child{ transform:rotate(180deg); }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:1rem;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
  }

  form{ display:flex; flex-direction:column; gap:12px; }
  .field label{
    display:block;
    font-size:.72rem;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  input,select,textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:9px 10px;
    font-size:.88rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{ resize:vertical; min-height:88px; }

  .btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-whats{ background:var(--whats); color:var(--whats-ink); }
  .btn-whats:hover{ filter:brightness(1.05); }
  .btn-whats[disabled]{ opacity:.45; cursor:not-allowed; }

  .empty{ color:var(--text-muted); font-size:.85rem; }

  .list{ display:grid; gap:10px; }
  @media (min-width:640px){ .list.two-col{ grid-template-columns:1fr 1fr; } }

  .row{
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .row .name{ font-weight:700; font-size:.92rem; }
  .row .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:6px;
    font-size:.75rem;
    color:var(--text-muted);
  }
  .row .meta span{ display:flex; align-items:center; gap:4px; }
  .row .meta svg{ flex:none; opacity:.8; }
  .row .stack{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }

  .icon-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    flex:none;
  }
  .icon-btn:hover{ color:var(--danger); background:var(--surface); }

  .pill{
    display:inline-block;
    background:var(--chip);
    color:var(--chip-ink);
    font-size:.68rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .toggle-group{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toggle{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:10px;
    padding:9px;
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .toggle[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .note{
    font-size:.78rem;
    color:var(--text-muted);
    background:var(--surface-sunken);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    line-height:1.45;
  }
  .error{ color:var(--danger); font-size:.82rem; }

  .filterbar{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .search-wrap{ position:relative; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none; }
  .search-wrap input{ padding-left:34px; }
  .daypills{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .daypill{
    flex:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:999px;
    padding:6px 13px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
  }
  .daypill[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .daypill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .day-group + .day-group{ margin-top:20px; }
  .day-group-header{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.05rem;
    font-weight:700;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .day-group-header .count{ font-family:inherit; font-size:.72rem; font-weight:600; color:var(--text-muted); }
  .time-group + .time-group{ margin-top:14px; }
  .time-group-header{
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-muted);
    margin:0 0 6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .row-compact{ padding:9px 12px; }
  .row-compact .name{ font-size:.85rem; }
  .gate{
    max-width:360px;
    margin:15vh auto 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .gate h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:1.4rem;
    margin:0;
    text-align:center;
  }
  .spinner{
    width:18px; height:18px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="page">
  <header class="hero">
    <div>
      <h1>Painel da Coordenação</h1>
      <p>Gestão de horários, professores e comunicação rápida</p>
    </div>
    <div class="hero-meta" id="hero-meta">Compartilhado entre todos os dispositivos</div>
  </header>

  <nav class="tabs" id="tabs" style="display:none"></nav>

  <div id="tabpanel"></div>
</div>

<script>
(function(){
  const SUPABASE_URL = 'https://jrkbwzpyzgekycqtmvco.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impya2J3enB5emdla3ljcXRtdmNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NTUwMzAsImV4cCI6MjA5NzEzMTAzMH0.-G7zDgGQ5ha6brAk3rk-hpRaZs36QM_z9dumLDLi0rg';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const ICONS = {
    calendar:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    userCheck:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>',
    message:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    send:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>',
    clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    pin:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    mail:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
    phone:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    id:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>',
    swap:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg>',
    copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    chevron:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
  };

  const maskCpf = v => v.replace(/\D/g,'').slice(0,11)
    .replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  const maskTelefone = v => v.replace(/\D/g,'').slice(0,11)
    .replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');

  const NOMES_DIA_JS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const diaDeHoje = NOMES_DIA_JS[new Date().getDay()];

  let state = {
    senha: sessionStorage.getItem('fest_senha') || '',
    professores: [],
    horarios: [],
    lideres: [],
    activeTab: 'horarios',
    novoProf: { id:null, nome:'', cpf:'', dataNasc:'', email:'', telefone:'' },
    novoHorario: { id:null, professor:'', dia:'Segunda', horario:'', turma:'', disciplina:'' },
    novoLider: { id:null, periodo:'', nome:'', telefone:'' },
    mensagem: { destinatarioTipo:'lider', id:'', texto:'' },
    substituicao: { professorAusenteId:'', aulaAusenteId:'', data:'', substitutoNome:'', textoEditado:null },
    filtroHorarios: { busca:'', dia: (diaDeHoje === 'Domingo' || diaDeHoje === 'Sábado') ? 'Todos' : diaDeHoje, formAberto:false }
  };

  // Todo acesso passa por essas funções RPC (com senha), nunca direto nas
  // tabelas — a proteção real está no banco (RLS deny-all + senha), não aqui.
  async function carregarDados(senha){
    const { data, error } = await sb.rpc('fest_listar_tudo', { p_senha: senha });
    if (error) throw error;
    state.professores = data.professores || [];
    state.horarios = data.horarios || [];
    state.lideres = data.lideres || [];
  }

  function renderGate(loading, erro){
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('tabpanel').innerHTML = `
      <div class="gate">
        <h1>Painel da Coordenação</h1>
        <form id="gate-form" class="card" style="display:flex;flex-direction:column;gap:12px;">
          <div class="field"><label>Senha de acesso</label><input type="password" id="gate-senha" autocomplete="current-password"></div>
          ${erro ? `<p class="error">${esc(erro)}</p>` : ''}
          <button type="submit" class="btn btn-primary" ${loading ? 'disabled' : ''}>${loading ? '<span class="spinner"></span> Entrando...' : 'Entrar'}</button>
        </form>
      </div>`;
    const f = document.getElementById('gate-form');
    const input = document.getElementById('gate-senha');
    if (!loading) input.focus();
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      const senha = input.value;
      renderGate(true, '');
      try {
        await carregarDados(senha);
        state.senha = senha;
        sessionStorage.setItem('fest_senha', senha);
        document.getElementById('tabs').style.display = '';
        renderAll();
      } catch(err){
        renderGate(false, 'Senha incorreta.');
      }
    });
  }

  async function boot(){
    if (state.senha) {
      renderGate(true, '');
      try {
        await carregarDados(state.senha);
        document.getElementById('tabs').style.display = '';
        renderAll();
      } catch(err){
        sessionStorage.removeItem('fest_senha');
        state.senha = '';
        renderGate(false, '');
      }
    } else {
      renderGate(false, '');
    }
  }

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const TABS = [
    { id:'horarios', label:'Horários e Salas', icon:ICONS.calendar },
    { id:'professores', label:'Professores', icon:ICONS.users },
    { id:'lideres', label:'Líderes de Turma', icon:ICONS.userCheck },
    { id:'substituicao', label:'Substituição', icon:ICONS.swap },
    { id:'mensagens', label:'Disparo WhatsApp', icon:ICONS.message }
  ];

  const DIA_SEMANA_NUM = { 'Domingo':0, 'Segunda':1, 'Terça':2, 'Quarta':3, 'Quinta':4, 'Sexta':5, 'Sábado':6 };

  function proximaDataPara(diaNome){
    const alvo = DIA_SEMANA_NUM[diaNome];
    if (alvo === undefined) return '';
    const hoje = new Date();
    for (let i = 0; i < 7; i++){
      const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
      if (d.getDay() === alvo) return isoDate(d);
    }
    return '';
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatarDataBR(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-');
    return `${d}/${m}/${a}`;
  }
  function diaSemanaDaData(iso){
    if (!iso) return '';
    const [a,m,d] = iso.split('-').map(Number);
    const dt = new Date(a, m-1, d);
    return Object.keys(DIA_SEMANA_NUM).find(k => DIA_SEMANA_NUM[k] === dt.getDay());
  }

        ${t.icon}${esc(t.label)}

    nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      state.activeTab = b.dataset.tab;

  function horariosFiltrados(){
    const f = state.filtroHorarios;
    const buscaLower = f.busca.trim().toLowerCase();
    let rows = state.horarios.filter(item => {
      if (f.dia !== 'Todos' && item.dia !== f.dia) return false;
      if (buscaLower) {
        const alvo = (item.professor + ' ' + item.turma + ' ' + item.disciplina).toLowerCase();
        if (!alvo.includes(buscaLower)) return false;
      }
      return true;
    });
    const ordemDia = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    rows.sort((a,b) => {
      const d = ordemDia.indexOf(a.dia) - ordemDia.indexOf(b.dia);
      if (d !== 0) return d;
      if (a.horario !== b.horario) return a.horario.localeCompare(b.horario);
      return a.turma.localeCompare(b.turma, 'pt-BR');
    });
    return rows;
  }

  function renderHorariosResultados(){
    const rows = horariosFiltrados();
    if (rows.length === 0) return `<p class="empty" style="margin-top:12px">Nenhum horário encontrado com esse filtro.</p>`;
    const mostrarCabecalhoDia = state.filtroHorarios.dia === 'Todos';
    const porDia = [];
    rows.forEach(item => {
      let grupo = porDia.find(g => g.dia === item.dia);
      if (!grupo) { grupo = { dia: item.dia, itens: [] }; porDia.push(grupo); }
      grupo.itens.push(item);
    });
    return porDia.map(grupoDia => {
      const porHorario = [];
      grupoDia.itens.forEach(item => {
        let g = porHorario.find(g => g.horario === item.horario);
        if (!g) { g = { horario: item.horario, itens: [] }; porHorario.push(g); }
        g.itens.push(item);
      });
      return `
      <div class="day-group">
        ${mostrarCabecalhoDia ? `<div class="day-group-header">${esc(grupoDia.dia)}${grupoDia.dia===diaDeHoje ? ' <span class="pill">hoje</span>' : ''} <span class="count">${grupoDia.itens.length} aula${grupoDia.itens.length===1?'':'s'}</span></div>` : ''}
        ${porHorario.map(g => `
          <div class="time-group">
            <div class="time-group-header">${ICONS.clock} ${esc(g.horario)} <span style="font-weight:400">(${g.itens.length})</span></div>
            <div class="list">
              ${g.itens.map(item => `
                <div class="row row-compact">
                  <div>
                    <div class="name">${esc(item.turma) || '(sem turma definida)'}</div>
                    <div class="meta">
                      <span>${ICONS.users} ${esc(item.professor)}</span>
                      ${item.disciplina ? `<span>${esc(item.disciplina)}</span>` : ''}
                    </div>
                  </div>
                  <div style="display:flex;gap:2px">
                    <button class="icon-btn" data-edit-horario="${item.id}" aria-label="Editar horário">${ICONS.edit}</button>

                  </div>
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    }).join('');
  }

  function calcularSubstituicao(){
    const s = state.substituicao;
    const profAusente = state.professores.find(p => String(p.id) === String(s.professorAusenteId));
    const aulasDoAusente = profAusente ? state.horarios.filter(h => h.professor === profAusente.nome) : [];
    const aulaAusente = aulasDoAusente.find(h => String(h.id) === String(s.aulaAusenteId));

    let candidatos = [];
    if (profAusente && aulaAusente) {
      // Professores que lecionam para a mesma turma...
      const nomesDaTurma = new Set(
        state.horarios.filter(h => h.turma === aulaAusente.turma && h.professor !== profAusente.nome).map(h => h.professor)
      );
      // ...e que não têm nenhuma aula própria alocada nesse dia+horário exatos.
      candidatos = Array.from(nomesDaTurma).filter(nome => {
        const ocupado = state.horarios.some(h => h.professor === nome && h.dia === aulaAusente.dia && h.horario === aulaAusente.horario);
        return !ocupado;
      }).map(nome => {
        const aulaNaTurma = state.horarios.find(h => h.professor === nome && h.turma === aulaAusente.turma);
        return { nome, disciplina: aulaNaTurma ? aulaNaTurma.disciplina : '' };
      }).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    }

    const substituto = candidatos.find(c => c.nome === s.substitutoNome);

    let texto = '';
    if (profAusente && aulaAusente && substituto && s.data) {
      texto = `Aviso de Alteração na Grade Horária - ${aulaAusente.turma}\n\n` +
        `Informamos que no dia ${formatarDataBR(s.data)}, no horário das ${aulaAusente.horario}, o(a) Prof.(a) ${profAusente.nome}` +
        `${aulaAusente.disciplina ? ' (' + aulaAusente.disciplina + ')' : ''} precisará ausentar-se.\n\n` +
        `A aula será assumida pelo(a) Prof.(a) ${substituto.nome}, que ministrará a disciplina de ${substituto.disciplina || '(a definir)'} neste horário.`;
    }

    return { profAusente, aulasDoAusente, aulaAusente, candidatos, substituto, texto };
  }

          <select id="s-substituto">

        ${d.substituto && s.data ? `

  function renderAll(){
    renderTabs();
    const panel = document.getElementById('tabpanel');
    if (state.activeTab === 'horarios') panel.innerHTML = renderHorarios();
    else if (state.activeTab === 'professores') panel.innerHTML = renderProfessores();
    else if (state.activeTab === 'lideres') panel.innerHTML = renderLideres();
    else if (state.activeTab === 'substituicao') panel.innerHTML = renderSubstituicao();
    else panel.innerHTML = renderMensagens();
    bind();
  }

  function bind(){
    if (state.activeTab === 'horarios') {
      const f = document.getElementById('form-horario');
      const profSel = document.getElementById('h-professor');
      if (profSel) profSel.addEventListener('change', e=>{ state.novoHorario.professor = e.target.value; });
      ['h-dia','h-horario','h-turma','h-disciplina'].forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          const map = {'h-dia':'dia','h-horario':'horario','h-turma':'turma','h-disciplina':'disciplina'};
          state.novoHorario[map[id]] = e.target.value;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoHorario.professor || !state.novoHorario.horario) return;
        const conflitoProfessor = state.horarios.some(h => h.professor===state.novoHorario.professor && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
        if (conflitoProfessor) { alert(state.novoHorario.professor + ' já tem uma aula alocada nesse dia e horário.'); return; }
        const turmaLimpa = state.novoHorario.turma.trim();
        if (turmaLimpa) {
          const conflitoTurma = state.horarios.some(h => h.turma.trim()===turmaLimpa && h.dia===state.novoHorario.dia && h.horario===state.novoHorario.horario);
          if (conflitoTurma) { alert('A turma ' + turmaLimpa + ' já está ocupada nesse dia e horário.'); return; }
        }
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoHorario.id;
        const args = {
          p_senha: state.senha, p_professor: state.novoHorario.professor, p_dia: state.novoHorario.dia,
          p_horario: state.novoHorario.horario, p_turma: state.novoHorario.turma, p_disciplina: state.novoHorario.disciplina
        };
        const { error } = editando
          ? await sb.rpc('fest_update_horario', { ...args, p_id: editando })
          : await sb.rpc('fest_add_horario', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoHorario = { id:null, professor:'', dia:'Segunda', horario:'', turma:'', disciplina:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('h-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoHorario = { id:null, professor:'', dia:'Segunda', horario:'', turma:'', disciplina:'' };
        renderAll();
      });
      bindResultadosHorarios();
      const buscaInput = document.getElementById('h-busca');
      if (buscaInput) buscaInput.addEventListener('input', e=>{
        state.filtroHorarios.busca = e.target.value;
        document.getElementById('h-resultados').innerHTML = renderHorariosResultados();
        bindResultadosHorarios();
      });
      panel_query('.daypill').forEach(b=>b.addEventListener('click', ()=>{
        state.filtroHorarios.dia = b.dataset.dia;
        renderAll();
      }));
    }
    if (state.activeTab === 'professores') {
      const f = document.getElementById('form-prof');
      const map = {'p-nome':'nome','p-cpf':'cpf','p-data':'dataNasc','p-email':'email','p-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'p-cpf') v = maskCpf(v);
          if (id === 'p-telefone') v = maskTelefone(v);
          state.novoProf[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoProf.nome) return;
        const cpfLimpo = state.novoProf.cpf.replace(/\D/g,'');
        const editando = state.novoProf.id;
        if (cpfLimpo && state.professores.some(p => p.cpf.replace(/\D/g,'') === cpfLimpo && String(p.id) !== String(editando))) {
          alert('Já existe um professor cadastrado com esse CPF.');
          return;
        }
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const args = {
          p_senha: state.senha, p_nome: state.novoProf.nome, p_cpf: state.novoProf.cpf,
          p_data_nasc: state.novoProf.dataNasc, p_email: state.novoProf.email, p_telefone: state.novoProf.telefone
        };
        const { error } = editando
          ? await sb.rpc('fest_update_professor', { ...args, p_id: editando })
          : await sb.rpc('fest_add_professor', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoProf = { id:null, nome:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('p-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoProf = { id:null, nome:'', cpf:'', dataNasc:'', email:'', telefone:'' };
        renderAll();
      });
      panel_query('[data-edit-prof]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.professores.find(p => String(p.id) === b.dataset.editProf);
        if (!item) return;
        state.novoProf = { id:item.id, nome:item.nome, cpf:item.cpf, dataNasc:item.data_nasc, email:item.email, telefone:item.telefone };
        renderAll();
      }));
      panel_query('[data-del-prof]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este professor do cadastro?')) return;
        const { error } = await sb.rpc('fest_delete_professor', { p_senha: state.senha, p_id: b.dataset.delProf });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
    }
    if (state.activeTab === 'lideres') {
      const f = document.getElementById('form-lider');
      const map = {'l-periodo':'periodo','l-nome':'nome','l-telefone':'telefone'};
      Object.keys(map).forEach(id=>{
        document.getElementById(id).addEventListener('input', e=>{
          let v = e.target.value;
          if (id === 'l-telefone') v = maskTelefone(v);
          state.novoLider[map[id]] = v;
          e.target.value = v;
        });
      });
      f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!state.novoLider.periodo || !state.novoLider.nome) return;
        const btn = f.querySelector('button[type=submit]');
        btn.disabled = true;
        const editando = state.novoLider.id;
        const args = { p_senha: state.senha, p_periodo: state.novoLider.periodo, p_nome: state.novoLider.nome, p_telefone: state.novoLider.telefone };
        const { error } = editando
          ? await sb.rpc('fest_update_lider', { ...args, p_id: editando })
          : await sb.rpc('fest_add_lider', args);
        if (error) { alert(error.message); btn.disabled = false; return; }
        state.novoLider = { id:null, periodo:'', nome:'', telefone:'' };
        await carregarDados(state.senha); renderAll();
      });
      const cancelarBtn = document.getElementById('l-cancelar');
      if (cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
        state.novoLider = { id:null, periodo:'', nome:'', telefone:'' };
        renderAll();
      });
      panel_query('[data-edit-lider]').forEach(b=>b.addEventListener('click', ()=>{
        const item = state.lideres.find(l => String(l.id) === b.dataset.editLider);
        if (!item) return;
        state.novoLider = { id:item.id, periodo:item.periodo, nome:item.nome, telefone:item.telefone };
        renderAll();
      }));
      panel_query('[data-del-lider]').forEach(b=>b.addEventListener('click', async ()=>{
        if (!confirm('Remover este líder de turma?')) return;
        const { error } = await sb.rpc('fest_delete_lider', { p_senha: state.senha, p_id: b.dataset.delLider });
        if (error) { alert(error.message); return; }
        await carregarDados(state.senha); renderAll();
      }));
    }
    if (state.activeTab === 'substituicao') {
      const s = state.substituicao;
      const profSel = document.getElementById('s-professor');
      if (profSel) profSel.addEventListener('change', e=>{
        state.substituicao = { professorAusenteId: e.target.value, aulaAusenteId:'', data:'', substitutoNome:'', textoEditado:null };
        renderAll();
      });
      const aulaSel = document.getElementById('s-aula');
      if (aulaSel) aulaSel.addEventListener('change', e=>{
        s.aulaAusenteId = e.target.value;
        s.substitutoNome = ''; s.textoEditado = null;
        const aula = state.horarios.find(h => String(h.id) === String(s.aulaAusenteId));
        s.data = aula ? proximaDataPara(aula.dia) : '';
        renderAll();
      });
      const dataInput = document.getElementById('s-data');
      if (dataInput) dataInput.addEventListener('input', e=>{
        s.data = e.target.value; s.textoEditado = null;
        renderAll();
      });
      const substSel = document.getElementById('s-substituto');
      if (substSel) substSel.addEventListener('change', e=>{
        s.substitutoNome = e.target.value; s.textoEditado = null;
        renderAll();
      });
      const textoArea = document.getElementById('s-texto');
      if (textoArea) textoArea.addEventListener('input', e=>{
        s.textoEditado = e.target.value;
        const whats = document.getElementById('s-whats');
        if (whats && !whats.hasAttribute('aria-disabled')) whats.href = buildSubstWhatsLink(e.target.value);
      });
      const copiarBtn = document.getElementById('s-copiar');
      if (copiarBtn) copiarBtn.addEventListener('click', async ()=>{
        const texto = document.getElementById('s-texto').value;
        try { await navigator.clipboard.writeText(texto); copiarBtn.textContent = 'Copiado!'; setTimeout(()=>{ copiarBtn.innerHTML = ICONS.copy + ' Copiar texto'; }, 1500); }
        catch(e){ alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.'); }
      });
      const whatsLink = document.getElementById('s-whats');
      if (whatsLink && !whatsLink.hasAttribute('aria-disabled')) {
        const texto = document.getElementById('s-texto') ? document.getElementById('s-texto').value : '';
        whatsLink.href = buildSubstWhatsLink(texto);
      }
    }
    if (state.activeTab === 'mensagens') {
      document.getElementById('tog-lider').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'lider', id:'' };
        renderAll();
      });
      document.getElementById('tog-prof').addEventListener('click', ()=>{
        state.mensagem = { ...state.mensagem, destinatarioTipo:'prof', id:'' };
        renderAll();
      });
      document.getElementById('m-dest').addEventListener('change', e=>{
        state.mensagem.id = e.target.value; renderAll();
      });
      document.getElementById('m-texto').addEventListener('input', e=>{
        state.mensagem.texto = e.target.value;
        const link = document.getElementById('m-send');
        if (link) link.href = buildWhatsLink();
      });
      const link = document.getElementById('m-send');
      if (link) link.href = buildWhatsLink();
    }
  }

  function buildSubstWhatsLink(texto){
    const d = calcularSubstituicao();
    const lider = d.aulaAusente ? state.lideres.find(l => l.periodo === d.aulaAusente.turma) : null;
    const num = (lider && lider.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(texto)}`;
  }

  function buildWhatsLink(){
    const list = state.mensagem.destinatarioTipo === 'lider' ? state.lideres : state.professores;
    const selected = list.find(x => String(x.id) === String(state.mensagem.id));
    const num = (selected && selected.telefone || '').replace(/\D/g,'');
    if (!num) return '#';
    return `https://wa.me/55${num}?text=${encodeURIComponent(state.mensagem.texto)}`;
  }

  function panel_query(sel){ return Array.from(document.getElementById('tabpanel').querySelectorAll(sel)); }

  function bindResultadosHorarios(){
    panel_query('[data-edit-horario]').forEach(b=>b.addEventListener('click', ()=>{
      const item = state.horarios.find(h => String(h.id) === b.dataset.editHorario);
      if (!item) return;
      state.novoHorario = { id:item.id, professor:item.professor, dia:item.dia, horario:item.horario, turma:item.turma, disciplina:item.disciplina };
      renderAll();
    }));
    panel_query('[data-del-horario]').forEach(b=>b.addEventListener('click', async ()=>{
      if (!confirm('Remover este horário da grade?')) return;
      const { error } = await sb.rpc('fest_delete_horario', { p_senha: state.senha, p_id: b.dataset.delHorario });
      if (error) { alert(error.message); return; }
      await carregarDados(state.senha); renderAll();
    }));
  }

  boot();
})();
</script>
</body>
</html>
